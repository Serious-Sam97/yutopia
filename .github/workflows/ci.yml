name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: NEXT_DIST_DIR=.next-prod pnpm --filter @yutopia/client build
      - run: pnpm budget
      - run: pnpm contrast
      - run: pnpm perf

  # Jolt (docs/plan/50, guardrails 3–4) on x86-64: the bench's 8 behaviour checks, its hashes
  # against the recorded ones (tools/physics-bench/RESULTS.md) and its heap over a long session.
  # A hash that differs means Jolt isn't deterministic here: build it with CROSS_PLATFORM_DETERMINISTIC.
  physics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm physics

