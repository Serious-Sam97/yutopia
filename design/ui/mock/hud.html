<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Yutopia HUD mock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&family=Share+Tech+Mono&family=VT323&display=block" rel="stylesheet">
<style>
/* Three directions for the base UI, one DOM. ?d=a|b|c&s=hud|settings|mobile */
:root {
  --font-body: Inter, system-ui, sans-serif;
}
/* A — hi-fi, tuned: today's walnut and amber, cleaned up */
html[data-d="a"] {
  --panel: linear-gradient(180deg, #3b281b, #2a1c13);
  --panel-solid: #2f2118;
  --edge: 1px solid #5a412f;
  --shadow: 0 1px 0 rgba(255,220,170,.08) inset, 0 12px 32px rgba(0,0,0,.45);
  --r: 14px;
  --text: #f3e9d3;
  --dim: #d3c4a2;
  --label: #ffb35c;
  --well: #1a120c;
  --well-edge: 1px solid #000;
  --btn: linear-gradient(180deg, #ece2c9, #cdbf9f);
  --btn-edge: 0;
  --btn-shadow: 0 3px 0 #8f8166, 0 4px 8px rgba(0,0,0,.4);
  --btn-text: #2a2420;
  --on: linear-gradient(180deg, #ffbe6a, #e8952d);
  --on-text: #2a1a0c;
  --danger: linear-gradient(180deg, #c9694a, #9e4a2e);
  --danger-text: #fff3e6;
  --accent: #ffa630;
  --good: #9ab85a;
  --divider: #4a3527;
  --font-head: "Share Tech Mono", monospace;
  --font-num: VT323, monospace;
  --num-size: 30px;
  --num-color: #ffb35c;
  --head-case: uppercase;
  --head-track: .08em;
  --tip: #f3e9d3;
  --tip-text: #2a2420;
}
/* B — ink & paper: the people's ligne claire — one even ink line, flat colour */
html[data-d="b"] {
  --panel: #f7f2e7;
  --panel-solid: #f7f2e7;
  --edge: 2px solid #151515;
  --shadow: 3px 3px 0 #151515;
  --r: 12px;
  --text: #151515;
  --dim: #5b554b;
  --label: #8a7f6c;
  --well: #ece4d2;
  --well-edge: 2px solid #151515;
  --btn: #fffaf0;
  --btn-edge: 2px solid #151515;
  --btn-shadow: 2px 2px 0 #151515;
  --btn-text: #151515;
  --on: #f4c64a;
  --on-text: #151515;
  --danger: #d2463c;
  --danger-text: #fff;
  --accent: #d2463c;
  --good: #3f8f5a;
  --divider: #cfc5b0;
  --font-head: "Bricolage Grotesque", Inter, sans-serif;
  --font-num: "Bricolage Grotesque", Inter, sans-serif;
  --num-size: 26px;
  --num-color: #151515;
  --head-case: none;
  --head-track: 0;
  --tip: #151515;
  --tip-text: #f7f2e7;
}
/* C — frost: dark glass over the snow, quiet */
html[data-d="c"] {
  --panel: rgba(18, 24, 33, .58);
  --panel-solid: rgba(18, 24, 33, .78);
  --edge: 1px solid rgba(255,255,255,.16);
  --shadow: 0 10px 30px rgba(10,20,35,.25);
  --r: 18px;
  --text: #f4f7fb;
  --dim: rgba(228,236,246,.74);
  --label: rgba(190,212,236,.66);
  --well: rgba(255,255,255,.06);
  --well-edge: 1px solid rgba(255,255,255,.1);
  --btn: rgba(255,255,255,.09);
  --btn-edge: 1px solid rgba(255,255,255,.12);
  --btn-shadow: none;
  --btn-text: #f4f7fb;
  --on: #9ad6ff;
  --on-text: #0b1520;
  --danger: rgba(255, 92, 80, .9);
  --danger-text: #fff;
  --accent: #9ad6ff;
  --good: #7fe0a0;
  --divider: rgba(255,255,255,.12);
  --font-head: Inter, sans-serif;
  --font-num: "JetBrains Mono", monospace;
  --num-size: 24px;
  --num-color: #f4f7fb;
  --head-case: none;
  --head-track: -.01em;
  --tip: rgba(10,16,24,.9);
  --tip-text: #f4f7fb;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body {
  font-family: var(--font-body);
  color: var(--text);
  background: #c9ced6 url(bg-courtyard.png) center / cover no-repeat;
  -webkit-font-smoothing: antialiased;
  position: relative;
}
svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.panel {
  background: var(--panel);
  border: var(--edge);
  box-shadow: var(--shadow);
  border-radius: var(--r);
}
html[data-d="c"] .panel { backdrop-filter: blur(16px) saturate(1.3); -webkit-backdrop-filter: blur(16px) saturate(1.3); }
.label {
  font: 600 11px/1 var(--font-body);
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--label);
}
html[data-d="a"] .label { font-family: "Share Tech Mono", monospace; font-size: 12px; font-weight: 400; }
.num { font-family: var(--font-num); font-size: var(--num-size); color: var(--num-color); font-variant-numeric: tabular-nums; line-height: 1; }
html[data-d="a"] .num { text-shadow: 0 0 6px rgba(255,166,48,.45); }
html[data-d="b"] .num { font-weight: 800; }
html[data-d="c"] .num { font-weight: 500; letter-spacing: -.02em; }
.head { font-family: var(--font-head); text-transform: var(--head-case); letter-spacing: var(--head-track); }
html[data-d="b"] .head { font-weight: 800; }
html[data-d="c"] .head { font-weight: 650; }
.dim { color: var(--dim); }
.sep { width: 1px; align-self: stretch; margin: 10px 2px; background: var(--divider); }
html[data-d="b"] .sep { width: 2px; background: #151515; opacity: .12; }

.btn {
  width: 48px; height: 48px; border-radius: 12px;
  display: grid; place-items: center; position: relative;
  background: var(--btn); color: var(--btn-text);
  border: var(--btn-edge); box-shadow: var(--btn-shadow);
}
html[data-d="c"] .btn { border-radius: 14px; }
.btn.on { background: var(--on); color: var(--on-text); }
.btn.danger { background: var(--danger); color: var(--danger-text); }
html[data-d="a"] .btn.danger { box-shadow: 0 3px 0 #5e2a18, 0 4px 8px rgba(0,0,0,.4); }
.badge {
  position: absolute; top: -7px; right: -7px; min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: 10px; font: 700 11px/20px var(--font-body); text-align: center;
  background: var(--accent); color: #fff;
}
html[data-d="a"] .badge { background: #c9512a; }
html[data-d="b"] .badge { border: 2px solid #151515; line-height: 16px; }
html[data-d="c"] .badge { background: #ff6b5e; }
.key {
  display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 5px;
  border-radius: 5px; font: 600 11px/1 var(--font-body);
  background: var(--well); border: var(--well-edge); color: var(--text);
}
html[data-d="b"] .key { border-width: 1.5px; }

/* faces: flat discs with the person's colours */
.face { width: 34px; height: 34px; border-radius: 50%; position: relative; flex: none;
  display: grid; place-items: center; font: 700 13px/1 var(--font-body); color: #fff; }
html[data-d="b"] .face { border: 2px solid #151515; }
html[data-d="a"] .face, html[data-d="c"] .face { box-shadow: 0 0 0 2px var(--panel-solid); }
.face .dot { position: absolute; right: -2px; bottom: -2px; width: 11px; height: 11px; border-radius: 50%;
  background: var(--good); border: 2px solid var(--panel-solid); }
html[data-d="b"] .face .dot { border-color: #151515; border-width: 1.5px; }
.face .dot.dnd { background: #e0583f; }
.face .dot.away { background: #e8b23a; }
.face.talk { outline: 3px solid var(--good); outline-offset: 2px; }

/* ── top left: where I am, when it is ── */
.where { position: absolute; top: 16px; left: 16px; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 16px 0 12px; }
.mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex: none; }
html[data-d="a"] .mark { background: linear-gradient(180deg,#ffb35c,#d97a1c); color: #2a1a0c; }
html[data-d="b"] .mark { background: #d2463c; border: 2px solid #151515; color: #fff; }
html[data-d="c"] .mark { background: rgba(154,214,255,.18); color: #9ad6ff; }
.mark b { font: 800 17px/1 var(--font-head); }
html[data-d="a"] .mark b { font-family: VT323, monospace; font-size: 26px; font-weight: 400; }
.place .t { font-size: 17px; line-height: 1.1; }
html[data-d="a"] .place .t { font-size: 16px; color: var(--text); }
.place .s { font-size: 12.5px; margin-top: 3px; }
.when { display: flex; align-items: center; gap: 10px; }
.weather { display: flex; align-items: center; gap: 5px; font-size: 13px; }

/* ── top right: who's in ── */
.who { position: absolute; top: 16px; right: 16px; height: 60px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 14px; }
.stack { display: flex; }
.stack .face { margin-left: -9px; width: 30px; height: 30px; font-size: 12px; }
.stack .face:first-child { margin-left: 0; }
.more { background: var(--well); color: var(--dim) !important; font-size: 11px !important; }
html[data-d="b"] .more { color: #151515 !important; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 14px; }
.bars i { width: 4px; border-radius: 1px; background: var(--good); }
.me { display: flex; align-items: center; gap: 6px; padding: 4px 6px 4px 4px; border-radius: 22px; background: var(--well); border: var(--well-edge); }
.me .face { width: 32px; height: 32px; }

/* ── toast ── */
.toast { position: absolute; top: 16px; left: 50%; transform: translateX(-50%); height: 48px; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 8px; font-size: 14px; }
.toast .face { width: 30px; height: 30px; font-size: 12px; }

/* ── side panel: people ── */
.side { position: absolute; top: 92px; right: 16px; width: 344px; padding: 12px; }
.tabs { display: flex; gap: 6px; padding: 4px; border-radius: 12px; background: var(--well); border: var(--well-edge); }
.tab { flex: 1; height: 36px; border-radius: 9px; display: flex; align-items: center; justify-content: center; gap: 7px; font: 600 13.5px/1 var(--font-body); color: var(--dim); }
.tab.on { background: var(--panel-solid); color: var(--text); box-shadow: 0 1px 3px rgba(0,0,0,.2); }
html[data-d="a"] .tab.on { background: var(--on); color: var(--on-text); }
html[data-d="b"] .tab.on { background: #f4c64a; border: 2px solid #151515; box-shadow: none; }
.tab .n { font-size: 11.5px; opacity: .7; }
.x { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; color: var(--dim); }
.sect { display: flex; align-items: center; gap: 10px; margin: 16px 4px 8px; }
.sect::after { content: ""; flex: 1; height: 1px; background: var(--divider); }
html[data-d="b"] .sect::after { height: 2px; background: #151515; opacity: .1; }
.row { display: flex; align-items: center; gap: 11px; padding: 8px 6px; border-radius: 10px; }
.row.hover { background: var(--well); }
html[data-d="b"] .row.hover { background: #efe6d2; }
.row .n { font: 600 14.5px/1.2 var(--font-body); }
.row .p { font-size: 12.5px; margin-top: 2px; }
.row .grow { flex: 1; min-width: 0; }
.row .act { height: 32px; padding: 0 12px; border-radius: 9px; display: flex; align-items: center; font: 600 12.5px/1 var(--font-body);
  background: var(--btn); color: var(--btn-text); border: var(--btn-edge); box-shadow: var(--btn-shadow); }
html[data-d="b"] .row .act { box-shadow: 1.5px 1.5px 0 #151515; border-width: 1.5px; }
.wave { display: flex; align-items: center; gap: 2px; height: 16px; color: var(--good); }
.wave i { width: 3px; border-radius: 2px; background: currentColor; }
.hint { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--well); border: var(--well-edge); font-size: 13px; margin-top: 12px; }

/* ── prompt ── */
.prompt { position: absolute; left: 50%; bottom: 150px; transform: translateX(-50%); height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 16px 0 8px; font: 600 14.5px/1 var(--font-body); }
.prompt .key { min-width: 28px; height: 28px; font-size: 13px; border-radius: 7px; }

/* ── bottom: map · dock · hands ── */
.map { position: absolute; left: 16px; bottom: 16px; width: 196px; height: 172px; padding: 8px; display: flex; flex-direction: column; }
.map .m { flex: 1; border-radius: 9px; overflow: hidden; position: relative; background: var(--well); border: var(--well-edge); }
.map .bar { display: flex; align-items: center; justify-content: space-between; padding: 8px 2px 0; }
.map .zoom { display: flex; gap: 4px; }
.map .zoom span { width: 26px; height: 26px; display: grid; place-items: center; border-radius: 7px; background: var(--well); border: var(--well-edge); font: 600 15px/1 var(--font-body); }
.dock { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; padding: 9px 10px; }
.status { height: 48px; display: flex; align-items: center; gap: 8px; padding: 0 12px; border-radius: 12px; background: var(--well); border: var(--well-edge); font: 600 13.5px/1 var(--font-body); }
.status .d { width: 10px; height: 10px; border-radius: 50%; background: var(--good); }
.tip { position: absolute; bottom: 66px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 7px 10px; border-radius: 8px; display: flex; gap: 8px; align-items: center;
  background: var(--tip); color: var(--tip-text); font: 600 12.5px/1 var(--font-body); box-shadow: 0 6px 16px rgba(0,0,0,.25); }
.tip .key { background: rgba(255,255,255,.14); border: 0; color: inherit; }
html[data-d="a"] .tip .key { background: rgba(0,0,0,.1); }
.hands { position: absolute; right: 16px; bottom: 16px; display: flex; gap: 8px; padding: 9px 10px; }
.slot { width: 48px; height: 48px; border-radius: 12px; position: relative; display: grid; place-items: center; background: var(--well); border: var(--well-edge); color: var(--text); }
.slot.full { background: var(--btn); color: var(--btn-text); border: var(--btn-edge); box-shadow: var(--btn-shadow); }
.slot.sel { outline: 3px solid var(--accent); outline-offset: 2px; }
html[data-d="a"] .slot.sel { outline-color: #ffa630; }
html[data-d="b"] .slot.sel { outline: 3px solid #f4c64a; outline-offset: 1px; }
.slot sup { position: absolute; top: 3px; left: 5px; font: 600 9px/1 var(--font-body); color: var(--dim); }
.slot svg { margin: 6px 0 0 4px; }
.slot.full sup { color: inherit; opacity: .55; }

/* ── settings ── */
.scrim { position: absolute; inset: 0; background: rgba(10, 8, 6, .5); }
html[data-d="b"] .scrim { background: rgba(21, 21, 21, .35); }
html[data-d="c"] .scrim { background: rgba(8, 14, 22, .35); backdrop-filter: blur(3px); }
.modal { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 880px; height: 610px; display: flex; overflow: hidden; }
html[data-d="c"] .modal { background: rgba(18, 24, 33, .82); }
.rail { width: 232px; padding: 20px 14px; display: flex; flex-direction: column; gap: 2px; border-right: 1px solid var(--divider); }
html[data-d="b"] .rail { border-right: 2px solid #151515; background: #efe7d6; }
.rail h2 { font-size: 22px; margin: 2px 10px 16px; }
html[data-d="a"] .rail h2 { font-family: VT323, monospace; font-size: 30px; color: #ffb35c; text-shadow: 0 0 6px rgba(255,166,48,.45); font-weight: 400; }
.ri { height: 40px; display: flex; align-items: center; gap: 11px; padding: 0 10px; border-radius: 10px; font: 500 14px/1 var(--font-body); color: var(--dim); }
.ri.on { background: var(--well); color: var(--text); font-weight: 600; }
html[data-d="a"] .ri.on { background: var(--on); color: var(--on-text); }
html[data-d="b"] .ri.on { background: #f4c64a; border: 2px solid #151515; color: #151515; }
.ri.out { margin-top: auto; color: #e2735c; }
html[data-d="b"] .ri.out { color: #b8362d; }
.body { flex: 1; padding: 22px 26px; overflow: hidden; position: relative; }
.body h3 { font-size: 20px; }
html[data-d="a"] .body h3 { font-size: 18px; color: var(--text); }
.body .sub { font-size: 13.5px; margin-top: 4px; }
.close { position: absolute; top: 18px; right: 18px; height: 34px; padding: 0 10px; display: flex; gap: 6px; align-items: center; border-radius: 9px; background: var(--well); border: var(--well-edge); font: 600 12px/1 var(--font-body); color: var(--dim); }
.card { margin-top: 16px; padding: 14px 16px; border-radius: 12px; background: var(--well); border: var(--well-edge); }
html[data-d="b"] .card { background: #fffaf0; }
.slider { display: grid; grid-template-columns: 112px 1fr 30px; align-items: center; gap: 14px; height: 34px; font-size: 14px; }
.track { height: 6px; border-radius: 3px; background: var(--divider); position: relative; }
html[data-d="b"] .track { background: #ddd3bf; border: 1.5px solid #151515; height: 9px; }
.fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: inherit; background: var(--accent); }
html[data-d="a"] .fill { background: linear-gradient(90deg,#e8952d,#ffb35c); }
html[data-d="b"] .fill { background: #f4c64a; }
.thumb { position: absolute; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.35); }
html[data-d="a"] .thumb { background: #ffb35c; }
html[data-d="b"] .thumb { border: 2px solid #151515; box-shadow: none; }
.slider .v { text-align: right; font: 600 13px/1 var(--font-body); color: var(--dim); font-variant-numeric: tabular-nums; }
.toggle { display: flex; align-items: center; justify-content: space-between; min-height: 52px; gap: 20px; }
.toggle + .toggle { border-top: 1px solid var(--divider); }
html[data-d="b"] .toggle + .toggle { border-top: 1.5px solid #e2d8c4; }
.toggle .t { font: 600 14.5px/1.2 var(--font-body); }
.toggle .d { font-size: 12.5px; margin-top: 3px; }
.sw { width: 44px; height: 26px; border-radius: 13px; background: var(--divider); position: relative; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.3); }
.sw.on { background: var(--good); }
html[data-d="a"] .sw.on { background: #e8952d; }
html[data-d="b"] .sw { border: 2px solid #151515; background: #ddd3bf; }
html[data-d="b"] .sw::after { top: 1px; left: 1px; border: 2px solid #151515; box-shadow: none; }
html[data-d="b"] .sw.on { background: #3f8f5a; }
.sw.on::after { left: 21px; }
html[data-d="b"] .sw.on::after { left: 19px; }
.banner { display: flex; align-items: center; gap: 12px; margin-top: 16px; padding: 12px 14px; border-radius: 12px; font-size: 13.5px; }
html[data-d="a"] .banner { background: rgba(255,166,48,.12); border: 1px solid rgba(255,166,48,.35); }
html[data-d="b"] .banner { background: #fbe7a6; border: 2px solid #151515; }
html[data-d="c"] .banner { background: rgba(154,214,255,.12); border: 1px solid rgba(154,214,255,.3); }
.banner .grow { flex: 1; }
.pbtn { height: 36px; padding: 0 14px; border-radius: 10px; display: flex; align-items: center; font: 600 13px/1 var(--font-body); background: var(--on); color: var(--on-text); white-space: nowrap; }
html[data-d="b"] .pbtn { border: 2px solid #151515; box-shadow: 2px 2px 0 #151515; }
.selects { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
.sel { height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; font-size: 13.5px; background: var(--btn); color: var(--btn-text); border: var(--btn-edge); }
html[data-d="a"] .sel { background: #1a120c; color: var(--text); border: 1px solid #5a412f; }
.sel .k { font-size: 11px; color: var(--label); display: block; margin-bottom: 2px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }

/* ── mobile ── */
html[data-s="mobile"] body { background-image: url(bg-lot.png); background-position: 32% center; }
html[data-s="mobile"] .where { top: 12px; left: 12px; height: 52px; gap: 10px; padding: 0 12px 0 9px; }
html[data-s="mobile"] .where .mark { width: 30px; height: 30px; }
html[data-s="mobile"] .place .t { font-size: 15px; }
html[data-s="mobile"] .place .s { font-size: 11.5px; }
html[data-s="mobile"] .who { top: 12px; right: 12px; height: 52px; padding: 0 6px 0 10px; gap: 8px; }
.mapbtn { position: absolute; left: 12px; width: 52px; height: 52px; display: grid; place-items: center; }
.mdock { position: absolute; left: 12px; right: 12px; bottom: 14px; display: flex; justify-content: space-between; padding: 8px 9px; }
.mdock .btn { width: 50px; height: 50px; }
.mhands { position: absolute; left: 50%; transform: translateX(-50%); bottom: 92px; display: flex; gap: 7px; padding: 7px 8px; }
.mhands .slot { width: 44px; height: 44px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">

</svg>
<div id="app"></div>
<script>
const q = new URLSearchParams(location.search);
const d = q.get("d") || "b", s = q.get("s") || "hud";
document.documentElement.dataset.d = d;
document.documentElement.dataset.s = s;
const I = (id, sz = 20) => `<svg class="i" style="width:${sz}px;height:${sz}px"><use href="#${id}"/></svg>`;
const P = {
  bia: ["B", "#c8423a"], ana: ["A", "#3f7d5a"], cai: ["C", "#2f4a78"], dee: ["D", "#b07a2c"], eli: ["E", "#6b4f8a"],
};
const F = (k, dot = "", extra = "") =>
  `<span class="face ${extra}" style="background:${P[k][1]}">${P[k][0]}${dot !== null ? `<span class="dot ${dot}"></span>` : ""}</span>`;

const where = `
<header class="panel where">
  <span class="mark"><b>Y</b></span>
  <div class="place"><div class="t head">Courtyard</div><div class="s dim">${s === "mobile" ? "Ground floor" : "Snow Campus · ground floor"}</div></div>
  ${s === "mobile" ? `<span class="sep"></span><span class="num" style="font-size:${d === "a" ? 26 : 20}px">13:05</span>` : `
  <span class="sep"></span>
  <div class="when"><span class="num">13:05</span><span class="weather dim">${I("snow", 16)} −4°</span></div>`}
</header>`;
const who = s === "mobile" ? `
<header class="panel who">
  <span style="display:flex;align-items:center;gap:6px;font:600 13px/1 var(--font-body)"><span class="face" style="width:9px;height:9px;background:var(--good);box-shadow:none;border:0"></span>5</span>
  <span class="me">${F("bia", null)}</span>
</header>` : `
<header class="panel who">
  <span class="stack">${F("ana", null)}${F("cai", null)}${F("dee", null)}<span class="face more">+2</span></span>
  <span style="font:600 13.5px/1 var(--font-body)">5 <span class="dim" style="font-weight:500">online</span></span>
  <span class="bars"><i style="height:5px"></i><i style="height:9px"></i><i style="height:14px"></i></span>
  <span class="me">${F("bia", "")}${I("down", 16)}</span>
</header>`;
const toast = `<div class="panel toast">${F("cai", null)}<span><b>Cai</b> <span class="dim">walked into the Courtyard</span></span></div>`;
const side = `
<aside class="panel side">
  <div style="display:flex;gap:8px;align-items:center">
    <div class="tabs" style="flex:1"><span class="tab on">${I("users", 16)} People <span class="n">5</span></span><span class="tab">${I("door", 16)} Room</span></div>
    <span class="x">${I("x", 18)}</span>
  </div>
  <div class="sect"><span class="label">Can hear you · 2</span></div>
  <div class="row">${F("ana", "", "talk")}<div class="grow"><div class="n">Ana</div><div class="p dim">Talking · 3 m away</div></div>
    <span class="wave"><i style="height:6px"></i><i style="height:13px"></i><i style="height:9px"></i><i style="height:15px"></i><i style="height:7px"></i></span></div>
  <div class="row">${F("cai")}<div class="grow"><div class="n">Cai</div><div class="p dim">5 m away</div></div><span class="dim">${I("mic-off", 17)}</span></div>
  <div class="sect"><span class="label">Elsewhere · 2</span></div>
  <div class="row hover">${F("dee", "away")}<div class="grow"><div class="n">Dee</div><div class="p dim">Lobby · floor 1</div></div><span class="act">Go to</span></div>
  <div class="row">${F("eli", "dnd")}<div class="grow"><div class="n">Eli</div><div class="p dim">Focus · Booth 2</div></div></div>
  <div class="sect"><span class="label">You</span></div>
  <div class="row">${F("bia")}<div class="grow"><div class="n">Bia</div><div class="p dim">Available · Courtyard</div></div></div>
  <div class="hint"><span style="color:var(--label)">${I("ear", 18)}</span><span class="dim">People within 8 m hear you. Walk up to someone to talk.</span></div>
</aside>`;
const prompt = `<div class="panel prompt"><span class="key">E</span>${I("door", 18)} Open the lobby door</div>`;
const map = `
<div class="panel map">
  <div class="m">${minimap()}</div>
  <div class="bar"><span class="label" style="display:flex;gap:6px;align-items:center">${I("nav", 13)} Grounds</span><span class="zoom"><span>−</span><span>+</span></span></div>
</div>`;
function minimap() {
  const ink = d === "b" ? "#151515" : d === "a" ? "#7a5636" : "rgba(255,255,255,.35)";
  const bld = d === "b" ? "#cfd8e2" : d === "a" ? "#3e2b1d" : "rgba(255,255,255,.14)";
  const snow = d === "b" ? "#fffaf0" : d === "a" ? "#241912" : "rgba(255,255,255,.05)";
  const road = d === "b" ? "#d8d0c0" : d === "a" ? "#33241a" : "rgba(255,255,255,.08)";
  const me = d === "b" ? "#c8423a" : d === "a" ? "#ffa630" : "#9ad6ff";
  return `<svg viewBox="0 0 180 120" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
    <rect width="180" height="120" fill="${snow}"/>
    <path d="M0 96 L180 88" stroke="${road}" stroke-width="10"/>
    <rect x="18" y="14" width="46" height="70" rx="3" fill="${bld}" stroke="${ink}" stroke-width="1.5"/>
    <rect x="116" y="14" width="46" height="70" rx="3" fill="${bld}" stroke="${ink}" stroke-width="1.5"/>
    <rect x="64" y="22" width="52" height="9" fill="${bld}" stroke="${ink}" stroke-width="1.2"/>
    <circle cx="80" cy="66" r="3.5" fill="${P.ana[1]}"/><circle cx="100" cy="64" r="3.5" fill="${P.cai[1]}"/>
    <g transform="translate(90 74)"><circle r="9" fill="${me}" opacity=".22"/><path d="M0 -6 L4.5 5 L0 2.5 L-4.5 5 Z" fill="${me}" stroke="${d === "b" ? "#151515" : "none"}" stroke-width="1"/></g>
  </svg>`;
}
const dock = `
<nav class="panel dock">
  <span class="btn danger">${I("mic-off")}</span><span class="btn">${I("video-off")}</span><span class="btn">${I("share")}</span>
  <span class="sep"></span>
  <span class="btn">${I("smile")}</span>
  <span class="btn" style="position:relative">${I("phone")}<span class="badge">9+</span>${s === "hud" ? `<span class="tip">Phone <span class="key">P</span></span>` : ""}</span>
  <span class="btn on">${I("users")}</span>
  <span class="sep"></span>
  <span class="status"><span class="d"></span>Available ${I("down", 15)}</span>
  <span class="sep"></span>
  <span class="btn">${I("hammer")}</span><span class="btn">${I("paw")}</span><span class="btn">${I("cog")}</span>
</nav>`;
const hands = (cls = "hands") => `
<div class="panel ${cls}">
  <span class="slot full sel"><sup>1</sup>${I("mug", 22)}</span>
  <span class="slot full"><sup>2</sup>${I("torch", 22)}</span>
  <span class="slot full"><sup>3</sup>${I("key", 22)}</span>
  <span class="slot"><sup>4</sup></span>
</div>`;

let html = "";
if (s === "hud") html = where + who + toast + side + prompt + map + dock + hands();
if (s === "settings")
  html = where + who + map + dock + hands() + `<div class="scrim"></div>
<section class="panel modal">
  <nav class="rail">
    <h2 class="head">Settings</h2>
    <span class="ri">${I("user", 18)} Me & my look</span>
    <span class="ri on">${I("vol", 18)} Sound & voice</span>
    <span class="ri">${I("cam", 18)} Camera</span>
    <span class="ri">${I("monitor", 18)} Graphics</span>
    <span class="ri">${I("pad", 18)} Controls</span>
    <span class="ri">${I("globe", 18)} Language</span>
    <span class="ri out">${I("out", 18)} Sign out</span>
  </nav>
  <div class="body">
    <span class="close">${I("x", 15)} Esc</span>
    <h3 class="head">Sound & voice</h3>
    <p class="sub dim">How loud things are, and how others hear you.</p>
    <div class="banner">${I("mic", 20)}<span class="grow">Your browser hasn't let Yutopia use your mic yet.</span><span class="pbtn">Allow mic</span></div>
    <div class="card">
      <div class="label" style="margin-bottom:8px">Mixer</div>
      ${[["Everything", 90], ["Voices", 100], ["Music", 50], ["TV & video", 80], ["Effects", 70]]
        .map(([n, v]) => `<div class="slider"><span>${n}</span><span class="track"><span class="fill" style="width:${v}%"></span><span class="thumb" style="left:${v}%"></span></span><span class="v">${v / 10}</span></div>`)
        .join("")}
    </div>
    <div class="card" style="padding-top:4px;padding-bottom:4px">
      <div class="toggle"><div><div class="t">Spatial audio</div><div class="d dim">Voices come from where people stand</div></div><span class="sw on"></span></div>
      <div class="toggle"><div><div class="t">Noise suppression</div><div class="d dim">Takes out keyboards and fans</div></div><span class="sw on"></span></div>
      <div class="toggle"><div><div class="t">Push to talk</div><div class="d dim">Hold <span class="key">Space</span> to speak</div></div><span class="sw"></span></div>
    </div>
  </div>
</section>`;
if (s === "mobile")
  html = where + who + `<div class="panel toast" style="top:76px;height:42px;font-size:13px">${F("cai", null)}<span><b>Cai</b> <span class="dim">is here</span></span></div>`
    + `<div class="panel prompt" style="bottom:160px;font-size:14px"><span class="key">Tap</span>Open the door</div>`
    + `<span class="panel mapbtn" style="bottom:92px">${I("map", 22)}</span>`
    + hands("mhands")
    + `<nav class="panel mdock">
      <span class="btn danger">${I("mic-off")}</span><span class="btn">${I("video-off")}</span>
      <span class="btn">${I("smile")}</span><span class="btn">${I("phone")}<span class="badge">9+</span></span>
      <span class="btn">${I("users")}</span><span class="btn">${I("more")}</span></nav>`;
document.getElementById("app").innerHTML = html;
</script>
</body>
</html>
