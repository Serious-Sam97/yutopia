<!doctype html>
<html>
<head>

<title>Yutopia HUD mock, real-world looks</title>

<style>
/* Six looks from things in the world, not computers. ?d=p|q|r|s|t|u */
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; }
body { background: #c9ced6 url(bg-courtyard.png) center / cover no-repeat; position: relative; -webkit-font-smoothing: antialiased; }

.abs { position: absolute; }
.row { display: flex; align-items: center; }
.col { display: flex; flex-direction: column; }
.grow { flex: 1; min-width: 0; }
.face { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 700 12px/1 Inter; flex: none; position: relative; }

/* ═════════ P — Wayfinding: the campus's own signs ═════════ */
html[data-d="p"] body { font-family: Inter, sans-serif; color: #fff; }
html[data-d="p"] .sign { background: #17283a; border-radius: 6px; box-shadow: 0 6px 18px rgba(10,20,35,.3); }

html[data-d="p"] .picto svg { width: 26px; height: 26px; stroke-width: 2.4; }
html[data-d="p"] .here { top: 18px; left: 18px; padding: 12px 18px 12px 12px; gap: 14px; }
html[data-d="p"] .here .t { font: 800 30px/1 Inter; letter-spacing: -.01em; }
html[data-d="p"] .here .s { font: 500 14px/1 Inter; color: #a8bdd3; margin-top: 6px; }
html[data-d="p"] .time { background: #ffcc00; color: #17283a; border-radius: 4px; padding: 10px 12px; font: 800 26px/1 Inter; font-variant-numeric: tabular-nums; margin-left: 10px; }
html[data-d="p"] .dirs { top: 100px; left: 18px; width: 340px; overflow: hidden; }
html[data-d="p"] .dir { height: 46px; padding: 0 14px 0 8px; gap: 12px; font: 700 17px/1 Inter; border-top: 1px solid #2c4258; }
html[data-d="p"] .dir:first-child { border-top: 0; }
html[data-d="p"] .dir .arr { width: 30px; height: 30px; border-radius: 3px; background: #ffcc00; color: #17283a; display: grid; place-items: center; }
html[data-d="p"] .dir .arr svg { stroke-width: 3; }
html[data-d="p"] .dir .m { margin-left: auto; font: 600 14px/1 Inter; color: #a8bdd3; font-variant-numeric: tabular-nums; }
html[data-d="p"] .board { top: 18px; right: 18px; width: 380px; background: #0d0f12; border-radius: 6px; padding: 14px 16px; box-shadow: 0 6px 18px rgba(0,0,0,.3); }
html[data-d="p"] .board h4 { font: 800 13px/1 Inter; letter-spacing: .12em; text-transform: uppercase; color: #ffcc00; display: flex; justify-content: space-between; margin-bottom: 10px; }
html[data-d="p"] .board .r { display: grid; grid-template-columns: 22px 1fr 1.2fr 70px; align-items: center; gap: 10px; height: 34px; border-top: 1px solid #23272e; font: 600 14.5px/1 Inter; }
html[data-d="p"] .board .r.hd { height: 22px; border: 0; font: 600 10.5px/1 Inter; letter-spacing: .1em; text-transform: uppercase; color: #7b8494; }
html[data-d="p"] .board .r .w { color: #c5ccd6; font-weight: 500; }
html[data-d="p"] .board .st { font: 700 11px/1 Inter; letter-spacing: .06em; text-transform: uppercase; text-align: right; }
html[data-d="p"] .board .face { width: 22px; height: 22px; font-size: 10px; border-radius: 3px; }
html[data-d="p"] .arrive { top: 18px; left: 50%; transform: translateX(-50%); padding: 8px 16px 8px 8px; gap: 10px; font: 600 15px/1 Inter; }
html[data-d="p"] .arrive .picto { width: 32px; height: 32px; background: #3fbf6f; color: #fff; }
html[data-d="p"] .arrive .picto svg { width: 20px; height: 20px; }
html[data-d="p"] .prompt { left: 50%; bottom: 150px; transform: translateX(-50%); background: #ffcc00; color: #17283a; border-radius: 4px; padding: 8px 18px 8px 8px; gap: 12px; font: 800 18px/1 Inter; box-shadow: 0 6px 18px rgba(10,20,35,.3); }
html[data-d="p"] .prompt .k { width: 34px; height: 34px; border-radius: 3px; background: #17283a; color: #ffcc00; display: grid; place-items: center; font: 800 17px/1 Inter; }
html[data-d="p"] .line { left: 18px; bottom: 18px; width: 340px; padding: 14px 18px 16px; }
html[data-d="p"] .line h5 { font: 700 11px/1 Inter; letter-spacing: .12em; text-transform: uppercase; color: #a8bdd3; margin-bottom: 14px; }
html[data-d="p"] .dock { left: 50%; bottom: 18px; transform: translateX(-50%); padding: 10px; gap: 8px; }
html[data-d="p"] .key { width: 64px; display: flex; flex-direction: column; align-items: center; gap: 6px; font: 700 10.5px/1 Inter; letter-spacing: .06em; text-transform: uppercase; color: #a8bdd3; position: relative; }
html[data-d="p"] .key .picto { width: 46px; height: 46px; }

html[data-d="p"] .slot sup { position: absolute; top: -8px; left: -6px; width: 18px; height: 18px; border-radius: 50%; background: #17283a; color: #fff; font: 700 10px/18px Inter; text-align: center; border: 2px solid #fff; }

/* ═════════ Q — Office stationery: badge, notes, label tape ═════════ */
html[data-d="q"] body { font-family: "Courier Prime", monospace; color: #222; }
html[data-d="q"] .badge { top: 0; left: 26px; width: 220px; }

html[data-d="q"] .sticky { top: 22px; left: 50%; margin-left: -110px; width: 230px; padding: 16px 16px 18px; background: #ffe866; transform: rotate(1.8deg); box-shadow: 0 8px 14px rgba(0,0,0,.2); font: 700 22px/1.15 Caveat; color: #2a2a2a; }
html[data-d="q"] .sticky::before { content: ""; position: absolute; top: -10px; left: 50%; margin-left: -40px; width: 80px; height: 22px; background: rgba(255,255,255,.55); transform: rotate(-3deg); }
html[data-d="q"] .board { top: 18px; right: 22px; width: 330px; }
html[data-d="q"] .cb { background: #b98a52; border-radius: 12px; padding: 30px 12px 12px; box-shadow: 0 10px 22px rgba(0,0,0,.3); position: relative; background-image: radial-gradient(rgba(0,0,0,.06) 1px, transparent 1px); background-size: 4px 4px; }
html[data-d="q"] .cb .metal { position: absolute; top: -10px; left: 50%; margin-left: -60px; width: 120px; height: 40px; border-radius: 8px 8px 4px 4px; background: linear-gradient(#f2f3f5, #9aa1aa); box-shadow: 0 2px 4px rgba(0,0,0,.35); }
html[data-d="q"] .sheet { background: #fbfaf5; padding: 14px 14px 10px; background-image: repeating-linear-gradient(180deg, transparent 0 33px, #d6e2f0 33px 34px); }
html[data-d="q"] .sheet h4 { font: 800 15px/1 Archivo; letter-spacing: .08em; text-transform: uppercase; border-bottom: 2px solid #222; padding-bottom: 7px; margin-bottom: 4px; }
html[data-d="q"] .entry { height: 34px; gap: 10px; font: 400 14.5px/1 "Courier Prime"; }
html[data-d="q"] .entry .face { width: 24px; height: 24px; font-size: 10px; }
html[data-d="q"] .entry .hw { margin-left: auto; font: 700 19px/1 Caveat; color: #1f4fa0; }
html[data-d="q"] .entry .hw.r { color: #c8423a; }
html[data-d="q"] .entry.hl { background: rgba(255, 232, 102, .55); margin: 0 -6px; padding: 0 6px; }

html[data-d="q"] .map { left: 22px; bottom: 22px; width: 220px; height: 170px; background: #f3efe2; transform: rotate(1.2deg); box-shadow: 0 8px 18px rgba(0,0,0,.3); overflow: hidden; }
html[data-d="q"] .map::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent 49.5%, rgba(0,0,0,.12) 50%, transparent 50.5%), linear-gradient(180deg, transparent 49.5%, rgba(0,0,0,.08) 50%, transparent 50.5%); }
html[data-d="q"] .tape { left: 268px; bottom: 24px; gap: 8px; align-items: flex-end; }
html[data-d="q"] .dymo { height: 36px; padding: 0 10px; gap: 6px; display: flex; align-items: center; border-radius: 3px; background: linear-gradient(#2a2a2a, #111); color: #f4f4f4; font: 700 12.5px/1 Archivo; letter-spacing: .13em; text-shadow: 0 -1px 0 #000, 0 1px 0 rgba(255,255,255,.25); box-shadow: 0 3px 6px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12); position: relative; }
html[data-d="q"] .dymo:nth-child(odd) { transform: rotate(-1deg); } html[data-d="q"] .dymo:nth-child(3n) { transform: rotate(1.2deg); }
html[data-d="q"] .dymo.red { background: linear-gradient(#d4473e, #a92f27); }

html[data-d="q"] .dymo .n { background: #ffe866; color: #222; text-shadow: none; font: 700 11px/1 Archivo; letter-spacing: 0; padding: 3px 5px; border-radius: 2px; margin-left: 2px; }
html[data-d="q"] .tags { right: 22px; bottom: 22px; gap: 8px; align-items: flex-end; }
html[data-d="q"] .tag { width: 58px; height: 76px; background: #d9b88a; border-radius: 4px 4px 4px 4px; clip-path: polygon(0 18%, 50% 0, 100% 18%, 100% 100%, 0 100%); display: flex; flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 8px; gap: 6px; color: #3a2a18; position: relative; box-shadow: 0 4px 8px rgba(0,0,0,.25); font: 700 18px/1 Caveat; }
html[data-d="q"] .tag::before { content: ""; position: absolute; top: 11px; left: 50%; margin-left: -5px; width: 10px; height: 10px; border-radius: 50%; background: #c9ced6; box-shadow: inset 0 0 0 2px #b0905f; }
html[data-d="q"] .tag.sel { background: #ffe866; transform: translateY(-8px); }

html[data-d="q"] .strip { left: 50%; bottom: 140px; transform: translateX(-50%) rotate(-.8deg); background: #fff; padding: 10px 18px; gap: 10px; font: 400 16px/1 "Courier Prime"; box-shadow: 0 6px 14px rgba(0,0,0,.25); clip-path: polygon(0 4%, 4% 0, 9% 5%, 15% 0, 22% 4%, 30% 0, 38% 5%, 46% 0, 54% 4%, 62% 0, 70% 5%, 78% 0, 86% 4%, 94% 0, 100% 3%, 100% 100%, 0 100%); }
html[data-d="q"] .strip .k { border: 2px solid #222; border-radius: 4px; padding: 3px 7px; font-weight: 700; }

/* ═════════ R — Swiss print: type and hairlines, one red ═════════ */
html[data-d="r"] body { font-family: Archivo, sans-serif; color: #111; }

html[data-d="r"] .pr .st { font: 700 11px/1 Archivo; letter-spacing: .06em; text-transform: uppercase; }

html[data-d="r"] .nav .pk { font: 500 14px/1 Archivo; gap: 14px; }
html[data-d="r"] .nav .pk span { display: flex; gap: 5px; align-items: baseline; color: #666; }

html[data-d="r"] .map { left: 24px; bottom: 88px; width: 200px; height: 140px; padding: 10px; }
html[data-d="r"] .prompt { left: 50%; bottom: 100px; transform: translateX(-50%); padding: 12px 18px; gap: 12px; font: 600 17px/1 Archivo; }

/* ═════════ S — Blueprint: the architect's drawing ═════════ */
html[data-d="s"] body { font-family: "IBM Plex Mono", monospace; color: #e8f1ff; }

html[data-d="s"] .kit { right: 18px; bottom: 18px; padding: 10px 12px 12px; }
html[data-d="s"] .kit h5 { font: 500 9.5px/1 "IBM Plex Mono"; letter-spacing: .14em; color: #9fc0ef; text-transform: uppercase; margin-bottom: 8px; }
html[data-d="s"] .kit .sl { gap: 8px; }
html[data-d="s"] .slot { width: 46px; height: 46px; border: 1.5px dashed #cfe2ff; display: grid; place-items: center; position: relative; }

html[data-d="s"] .prompt .k { width: 30px; height: 30px; border-radius: 50%; border: 1.5px solid #ffd25a; color: #ffd25a; display: grid; place-items: center; font-weight: 600; }
