<body>
<div id="bg"></div>
<div id="hud"></div>
<script>
const q = new URLSearchParams(location.search);
const LOOK = q.get("look") || "a", S = q.get("s") || "play";
document.documentElement.dataset.look = LOOK;
const BG = { play: "day", act: "diner", night: "night", wheel: "dusk" }[S];
const bg = document.getElementById("bg");
bg.style.backgroundImage = `url(bg/${BG}.jpg)`;
if (S === "wheel") bg.style.filter = LOOK === "b" ? "saturate(.35) brightness(.85) blur(2px)" : "saturate(.15) brightness(.6) blur(2px)";
if (S === "act" && LOOK !== "b") bg.style.filter = "brightness(.92)";

/* ---------- icons (stroke) ---------- */
const P = {
  micOff: '<path d="M9 9v3a3 3 0 0 0 5.1 2.1M15 9.3V5a3 3 0 0 0-5.9-.7"/><path d="M19 11a7 7 0 0 1-1.1 3.8M5 11a7 7 0 0 0 11.4 5.4M12 18v3M3 3l18 18"/>',

/* ---------- the radar: the street ahead is "up" (GTA), blips for the town's places ---------- */
function radar(w, h, theme) {
  const T = {
    a: { bg: "rgba(14,18,24,.0)", blk: "rgba(70,78,90,.55)", road: "#9aa3ad", line: "#c9b23a", snow: "rgba(210,225,240,.18)", me: "#fff", blip: "#fff", blipBg: "#1c1f25" },
    b: { bg: "#dff0e4", blk: "#bcd6c4", road: "#ffffff", line: "#f6c94a", snow: "#eef7f1", me: "#2a84dc", blip: "#fff", blipBg: "#2a84dc" },
    c: { bg: "#fbf6ea", blk: "#e6dcc4", road: "#141414", line: "#ffd23f", snow: "#fff", me: "#4fd35a", blip: "#141414", blipBg: "#ffd23f" },
  }[theme];
  const cx = w / 2, cy = h * 0.66;
  const blip = (x, y, ic) => `<g transform="translate(${x},${y})"><circle r="11" fill="${T.blipBg}" stroke="${theme === "c" ? "#141414" : "#fff"}" stroke-width="${theme === "c" ? 2.5 : 1.6}"/><g transform="translate(-7,-7) scale(.58)" fill="none" stroke="${theme === "c" ? "#141414" : T.blip}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${P[ic]}</g></g>`;
  const rw = theme === "c" ? 26 : 30;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block;background:${T.bg}">
    <rect width="${w}" height="${h}" fill="${T.snow}"/>
    ${[0, 1, 2, 3].map((i) => `<rect x="${cx - rw / 2 - 74}" y="${-10 + i * 62}" width="62" height="48" rx="3" fill="${T.blk}"/><rect x="${cx + rw / 2 + 12}" y="${-10 + i * 62}" width="62" height="48" rx="3" fill="${T.blk}"/>`).join("")}
    <rect x="${cx - rw / 2}" y="-10" width="${rw}" height="${h + 20}" fill="${T.road}"/>
    <rect x="-10" y="${cy - 52}" width="${w + 20}" height="${rw * 0.6}" fill="${T.road}"/>
    <rect x="-10" y="${cy + 66}" width="${w + 20}" height="${rw * 0.6}" fill="${T.road}"/>
    <rect x="-10" y="${h * 0.12}" width="${w + 20}" height="${rw * 0.6}" fill="${T.road}"/>
    <path d="M${cx - 1.6} -10 V${h + 10} M${cx + 1.6} -10 V${h + 10}" stroke="${T.line}" stroke-width="1.4"/>
    ${blip(cx - 62, cy - 86, "plate")}${blip(cx + 66, cy - 18, "cup")}${blip(cx + 60, cy - 150, "bell")}${blip(cx - 58, cy + 30, "pack")}
    <g transform="translate(${cx},${cy})"><path d="M0 -13 L10 10 L0 5 L-10 10Z" fill="${T.me}" stroke="${theme === "a" ? "#000" : theme === "b" ? "#fff" : "#141414"}" stroke-width="2"/></g>
  </svg>`;
}

/* ---------- the pie (the Sims action ring) ---------- */
const OPTS = [["sit", "Sit"], ["cup", "Order a coffee"], ["plate", "Order the special"], ["book", "Read the menu"], ["window", "Look out the window"]];
function pie(cx, cy, r, numbered) {
  const n = OPTS.length;
  return `<div class="pie">` + OPTS.map(([ic, t], i) => {
    const a = -Math.PI / 2 + (i * 2 * Math.PI) / n;
    const x = cx + Math.cos(a) * r * 1.45, y = cy + Math.sin(a) * r;
    return `<div class="opt${i === 1 ? " hi" : ""}" style="left:${x}px;top:${y}px">${numbered ? `<span class="n">${i + 1}</span>` : ""}${t}</div>`;
  }).join("") + `<div class="hub" style="left:${cx}px;top:${cy}px">${I("booth", 40)}</div><div class="name" style="left:${cx}px;top:${cy + r + 44}px">Diner booth</div></div>`;
}

/* ---------- the wheel (Tab held): the hands' slots + pack, phone, emote ---------- */
const WH = [
  ["torch", "Left hand · Torch", "battery 64%", "1"], ["revolver", "Revolver", "6 | 18", "2"], ["shotgun", "Shotgun", "2 | 14", "3"],
  ["ak", "AK", "30 | 60", "4"], [null, "Empty", "slot 5", "5"], ["pack", "Pack", "8 pockets", ""], ["phone", "Phone", "9 new", ""], ["emote", "Emote", "wave, dance…", ""],
];
function wheel(look) {
  const R0 = 128, R1 = 290, n = WH.length, cx = 720, cy = 450;
  const segs = WH.map(([k, t, s, key], i) => {
    const a0 = -Math.PI / 2 - Math.PI / n + (i * 2 * Math.PI) / n + 0.012, a1 = a0 + (2 * Math.PI) / n - 0.024;
    const pt = (r, a) => `${cx + Math.cos(a) * r} ${cy + Math.sin(a) * r}`;
    const d = `M${pt(R0, a0)} L${pt(R1, a0)} A${R1} ${R1} 0 0 1 ${pt(R1, a1)} L${pt(R0, a1)} A${R0} ${R0} 0 0 0 ${pt(R0, a0)}Z`;
    const hi = i === 2;
    const am = (a0 + a1) / 2, mx = cx + Math.cos(am) * (R0 + R1) / 2, my = cy + Math.sin(am) * (R0 + R1) / 2;
    const fill = look === "a" ? (hi ? "rgba(255,255,255,.92)" : "rgba(0,0,0,.6)") : look === "b" ? (hi ? "url(#gb)" : "rgba(235,245,255,.9)") : hi ? "#4fd35a" : "#fbf6ea";
    const stroke = look === "a" ? (hi ? "#fff" : "rgba(255,255,255,.25)") : look === "b" ? "#fff" : "#141414";
    const col = look === "a" ? (hi ? "#111" : "#fff") : look === "b" ? (hi ? "#fff" : "#1d5592") : "#141414";
    const pic = !k ? `<div style="font:700 13px/1 Inter Tight;opacity:.5">—</div>` : SIL[k] ? sil(k, 112, 38, col) : I(k, 36, `color:${col}`);
    const kk = key ? `<div style="position:absolute;left:${mx - 60}px;top:${my - 52}px;font:800 12px/1 ${look === "b" ? "Nunito" : "Inter Tight"};color:${col};opacity:.7">${key}</div>` : "";
    return { d, fill, stroke, hi, html: `<div style="position:absolute;left:${mx}px;top:${my}px;transform:translate(-50%,-50%);display:grid;place-items:center;color:${col}">${pic}</div>${kk}` };
  });
  const sw = look === "c" ? 3 : 1.5;
  return `<svg class="abs" style="left:0;top:0" width="1440" height="900"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#1f74cf"/></linearGradient></defs>
    ${look === "c" ? segs.map((s) => `<path d="${s.d}" transform="translate(5 5)" fill="#141414"/>`).join("") : ""}
    ${segs.map((s) => `<path d="${s.d}" fill="${s.fill}" stroke="${s.stroke}" stroke-width="${sw}"/>`).join("")}</svg>
    ${segs.map((s) => s.html).join("")}
    <div class="wcen" style="left:${cx}px;top:${cy}px"><div class="t">Shotgun</div><div class="s">2 in · 14 in the pack</div></div>`;
}

    h += `<div class="abs c-queue"><div class="q now">${I("walk", 30)}</div><div class="q">${I("sit", 24)}</div><div class="q">${I("cup", 24)}</div><div class="lbl">walking to the booth…</div></div>`;
    h += pie(330, 400, 112, true);
    h += `<div class="st k" style="right:36px;top:190px;padding:10px 16px;transform:rotate(-1.5deg);font:400 26px/1 Anton;letter-spacing:.02em;text-transform:uppercase">The Diner <span style="font:400 16px/1 'Permanent Marker';color:#ffd23f;text-transform:none;margin-left:6px">floor G</span></div>`;
  } else if (S === "night") {
    h += rad + me + clock("22:10", "Tue · −9° clear") + wep("shotgun", "2 <small>| 14</small>", "shotgun · torch 64%") + `<div class="crossh"></div>`;
    h += `<div class="st c-note" style="top:34px;transform:rotate(-1deg)"><div class="ic">${sil("flare", 30, 11, "#c2410c")}</div>+3 flares · in the pack</div>`;
    h += `<div class="st c-note" style="top:96px;transform:rotate(.8deg)"><div class="ic">${sil("aid", 30, 11, "#c2410c")}</div>+1 first aid kit · in the pack</div>`;
  } else {
    h += wheel("c") + me;
  }
  if (S !== "wheel") h += dock;
  return h;
}

const [bx, by, bs] = BOB_AT[S];
document.getElementById("hud").innerHTML = ({ a: A, b: B, c: C })[LOOK]() + (S === "wheel" ? "" : BOB(bx, by, bs));
</script>
