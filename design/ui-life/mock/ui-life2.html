/* the radar: the way ahead is "up" */
function radar(w, h, th) {
  const T = {
    a: { bg: "rgba(14,18,24,.72)", blk: "rgba(70,78,90,.6)", road: "#9aa3ad", line: "#c9b23a", me: "#fff", bb: "#1c1f25", bs: "#fff", bi: "#fff" },
    b: { bg: "#e4f2e8", blk: "#c3dbca", road: "#ffffff", line: "#f6c94a", me: "#2a84dc", bb: "#2a84dc", bs: "#fff", bi: "#fff" },
    d: { bg: "rgba(8,8,10,.7)", blk: "rgba(239,233,220,.1)", road: "rgba(239,233,220,.34)", line: "rgba(243,223,162,.55)", me: "#f3dfa2", bb: "rgba(8,8,10,.92)", bs: "rgba(239,233,220,.7)", bi: "#efe9dc" },
    c: { bg: "rgba(8,8,10,.62)", blk: "rgba(239,233,220,.13)", road: "rgba(239,233,220,.35)", line: "rgba(243,223,162,.0)", me: "#f3dfa2", bb: "rgba(8,8,10,.9)", bs: "rgba(239,233,220,.7)", bi: "#efe9dc" },
  }[th];
  const cx = w / 2, cy = h * (th === "a" || th === "d" ? 0.66 : 0.56);
  const rw = th === "c" ? 3 : th === "d" ? 14 : 30;
  const blip = (x, y, ic) => `<g transform="translate(${x},${y})"><circle r="${th === "c" ? 9 : 11}" fill="${T.bb}" stroke="${T.bs}" stroke-width="1.4"/><g transform="translate(-7,-7) scale(.58)" fill="none" stroke="${T.bi}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">${P[ic]}</g></g>`;
  const roadH = (y) => `<rect x="-10" y="${y}" width="${w + 20}" height="${th === "c" ? 2 : rw * 0.6}" fill="${T.road}"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" style="display:block">
    <rect width="${w}" height="${h}" fill="${T.bg}"/>
    ${[0, 1, 2, 3, 4].map((i) => `<rect x="${cx - 15 - 74}" y="${-30 + i * 62}" width="62" height="48" rx="3" fill="${T.blk}"/><rect x="${cx + 15 + 12}" y="${-30 + i * 62}" width="62" height="48" rx="3" fill="${T.blk}"/>`).join("")}
    <rect x="${cx - rw / 2}" y="-10" width="${rw}" height="${h + 20}" fill="${T.road}"/>
    ${roadH(cy - 52)}${roadH(cy + 66)}${roadH(h * 0.1)}
    <path d="M${cx - 1.6} -10 V${h + 10} M${cx + 1.6} -10 V${h + 10}" stroke="${T.line}" stroke-width="1.4"/>
    ${blip(cx - 62, cy - 86, "plate")}${blip(cx + 66, cy - 18, "cart")}${blip(cx + 60, cy - 150, "glass")}${blip(cx - 58, cy + 30, "mail")}
    <g transform="translate(${cx},${cy})"><path d="M0 -13 L10 10 L0 5 L-10 10Z" fill="${T.me}" stroke="${th === "a" ? "#000" : th === "b" ? "#fff" : "none"}" stroke-width="2" ${th === "c" || th === "d" ? 'style="filter:drop-shadow(0 0 6px rgba(243,223,162,.9))"' : ""}/></g>
  </svg>`;
}

/* the action ring (The Sims' pie): five things to do at the booth */
const OPTS = [["sit", "Sit"], ["cup", "Order a coffee"], ["plate", "Order the special"], ["book", "Read the menu"], ["window", "Look out the window"]];
function pie(cx, cy, r) {
  const L = LOOK === "e" || LOOK === "f" ? "a" : LOOK;
  const n = OPTS.length;
  const pos = OPTS.map((_, i) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [cx + Math.cos(a) * r * 1.5, cy + Math.sin(a) * r, a]; });
  if (L === "a") return `<div class="pie">` + OPTS.map(([ic, t], i) => `<div class="opt" style="left:${pos[i][0]}px;top:${pos[i][1]}px;background:${i === 1 ? (LOOK === "e" || LOOK === "f" ? "#f3d27a" : "#93d96d") : "#fff"};color:#111;font:700 16px/1 'Inter Tight';padding:10px 18px 10px 10px;border-radius:30px;box-shadow:0 4px 14px rgba(0,0,0,.45);display:flex;align-items:center;gap:9px"><span style="width:22px;height:22px;border-radius:50%;background:#111;color:#fff;font:800 12px/22px 'Inter Tight';text-align:center">${i + 1}</span>${t}</div>`).join("")
    + `<div class="opt" style="left:${cx}px;top:${cy}px;width:78px;height:78px;border-radius:50%;background:rgba(0,0,0,.78);box-shadow:0 0 0 3px #fff;display:grid;place-items:center;color:#fff">${I("booth", 38)}</div><div class="opt a-sh" style="left:${cx}px;top:${cy + r + 56}px;font:400 30px/1 'Bebas Neue';letter-spacing:.05em">Diner booth</div></div>`;
  if (L === "b") return `<div class="pie">` + OPTS.map(([ic, t], i) => `<div class="opt b-pill${i === 1 ? " on" : ""}" style="left:${pos[i][0]}px;top:${pos[i][1]}px;height:44px;font-size:16px;padding:0 18px">${t}</div>`).join("")
    + `<div class="opt" style="left:${cx}px;top:${cy}px;width:84px;height:84px;border-radius:50%;background:linear-gradient(180deg,#fff,#d6eafc);border:4px solid #fff;box-shadow:0 6px 16px rgba(10,50,100,.45);display:grid;place-items:center;color:#c8323a">${I("booth", 40)}</div><div class="opt" style="left:${cx}px;top:${cy + r + 52}px;font:900 16px/1 Nunito;background:rgba(18,62,106,.84);color:#fff;padding:8px 14px;border-radius:16px">Diner booth</div></div>`;
  // C: text on the dark, a thread from the thing to each
  const lines = pos.map(([x, y], i) => `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="${i === 1 ? "rgba(243,223,162,.9)" : "rgba(239,233,220,.3)"}" stroke-width="1"/>`).join("");
  return `<svg class="abs" style="left:0;top:0" width="1440" height="900">${lines}<circle cx="${cx}" cy="${cy}" r="34" fill="rgba(8,8,10,.6)" stroke="rgba(239,233,220,.8)"/></svg><div class="pie">`
    + OPTS.map(([ic, t], i) => `<div class="opt" style="left:${pos[i][0]}px;top:${pos[i][1]}px;display:flex;gap:10px;align-items:center;padding:9px 14px;background:${i === 1 ? "rgba(46,40,24,.9)" : "rgba(8,8,10,.8)"};border:1px solid ${i === 1 ? "#f3dfa2" : "rgba(239,233,220,.22)"};font:400 15px/1 'IBM Plex Mono';color:${i === 1 ? "#f3dfa2" : "#efe9dc"};${i === 1 ? "box-shadow:0 0 20px rgba(243,223,162,.25)" : ""}"><span style="font-size:11px;color:#a59f92">${i + 1}</span>${t}</div>`).join("")
    + `<div class="opt" style="left:${cx}px;top:${cy}px;color:#efe9dc">${I("booth", 30)}</div><div class="opt c-ttl" style="left:${cx}px;top:${cy + r + 52}px;font-size:17px;background:rgba(8,8,10,.7);padding:10px 16px 10px 21px">Diner booth</div></div>`;
}

/* the wheel (hold Tab): the hands' 5 slots, then pack, phone, emote */
const WH = [["torch", "Torch", "1"], ["revolver", "Revolver", "2"], ["shotgun", "Shotgun", "3"], [null, "", "4"], [null, "", "5"], ["pack", "Pack", ""], ["phone", "Phone", ""], ["emote", "Emote", ""]];
function wheel() {
  const L = LOOK === "e" || LOOK === "f" ? "a" : LOOK;
  const R0 = L === "c" ? 150 : 128, R1 = L === "c" ? 270 : 290, n = WH.length, cx = 720, cy = 450, gap = L === "c" ? 0.03 : L === "d" ? 0.02 : 0.012;
  const segs = WH.map(([k, t, key], i) => {
    const a0 = -Math.PI / 2 - Math.PI / n + (i * 2 * Math.PI) / n + gap, a1 = a0 + (2 * Math.PI) / n - 2 * gap;
    const pt = (r, a) => `${cx + Math.cos(a) * r} ${cy + Math.sin(a) * r}`;
    const d = `M${pt(R0, a0)} L${pt(R1, a0)} A${R1} ${R1} 0 0 1 ${pt(R1, a1)} L${pt(R0, a1)} A${R0} ${R0} 0 0 0 ${pt(R0, a0)}Z`;
    const hi = i === 2, am = (a0 + a1) / 2, mx = cx + (Math.cos(am) * (R0 + R1)) / 2, my = cy + (Math.sin(am) * (R0 + R1)) / 2;
    const fill = L === "a" ? (hi ? (LOOK === "e" || LOOK === "f" ? "rgba(243,215,140,.95)" : "rgba(255,255,255,.93)") : "rgba(0,0,0,.62)") : L === "b" ? (hi ? "url(#gb)" : "rgba(235,245,255,.92)") : hi ? "rgba(243,223,162,.16)" : "rgba(8,8,10,.55)";
    const stroke = L === "a" ? (hi ? "#fff" : "rgba(255,255,255,.25)") : L === "b" ? "#fff" : hi ? "#f3dfa2" : "rgba(239,233,220,.22)";
    const col = L === "a" ? (hi ? "#111" : "#fff") : L === "b" ? (hi ? "#fff" : "#1d5592") : hi ? "#f3dfa2" : "#efe9dc";
    const pic = !k ? `<div style="opacity:.4;font:600 13px/1 Inter Tight">empty</div>` : SIL[k] ? sil(k, 110, 37, col) : I(k, 34, `color:${col}`);
    const lab = t && !SIL[k] ? `<div style="font:${L === "b" ? "800 13px Nunito" : L === "c" || L === "d" ? "400 12px 'IBM Plex Mono'" : "700 13px 'Inter Tight'"};margin-top:6px;color:${col};opacity:.85">${t}</div>` : "";
    const kk = key ? `<div style="position:absolute;left:${mx}px;top:${my - 44}px;transform:translateX(-50%);font:700 12px/1 ${L === "b" ? "Nunito" : "'IBM Plex Mono'"};color:${col};opacity:.65">${key}</div>` : "";
    return { d, fill, stroke, html: `<div style="position:absolute;left:${mx}px;top:${my}px;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;color:${col}">${pic}${lab}</div>${kk}` };
  });
  const cen = L === "a" ? `<div class="abs a-sh" style="left:${cx}px;top:${cy}px;transform:translate(-50%,-50%);text-align:center"><div style="font:400 36px/1 'Bebas Neue';letter-spacing:.04em">Shotgun</div><div style="font:600 15px/1.3 'Inter Tight';opacity:.85;margin-top:4px">2 in · 14 in the pack</div></div>`
    : L === "b" ? `<div class="abs" style="left:${cx}px;top:${cy}px;transform:translate(-50%,-50%);width:184px;height:184px;border-radius:50%;background:linear-gradient(180deg,#fff,#d6eafc);border:5px solid #fff;box-shadow:0 10px 26px rgba(10,50,100,.45);display:flex;flex-direction:column;align-items:center;justify-content:center"><div style="font:900 23px/1 Nunito">Shotgun</div><div style="font:800 14px/1.3 Nunito;color:#5b7a9b;margin-top:5px">2 in · 14 in the pack</div></div>`
    : `<div class="abs c-glow" style="left:${cx}px;top:${cy}px;transform:translate(-50%,-50%);text-align:center"><div style="font:200 40px/1 Oswald;letter-spacing:.3em;padding-left:.3em;text-transform:uppercase">Shotgun</div><div class="c-cap" style="margin-top:12px">2 in · 14 in the pack</div></div>`;
  return `<svg class="abs" style="left:0;top:0" width="1440" height="900"><defs><linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fd0ff"/><stop offset="1" stop-color="#1f74cf"/></linearGradient></defs>
    ${segs.map((s) => `<path d="${s.d}" fill="${s.fill}" stroke="${s.stroke}" stroke-width="1.5"/>`).join("")}</svg>${segs.map((s) => s.html).join("")}${cen}`;
}

    h += `<div class="abs a-help">Hold <span class="a-key">RMB</span> to aim · <span class="a-key">R</span> reload<br><span class="a-key">F</span> torch on / off · <span class="a-key">Tab</span> swap</div>`;
    h += `<div class="abs a-place a-sh"><div class="sub">Main Street · Yutopia</div></div>`;
  } else if (S === "wheel") {
    h += wheel() + rad(false) + btns([["Tab", "Let go to take"], ["1–5", "Slot"], ["RMB", "Put away"]]);

  } else {
    // the pause: GTA's, tabs over the whole screen; Map open

      <div class="abs a-pzme a-sh"><div><div class="n">Ana Demo</div><div class="s">Tuesday 13:52 · $1,250 · ${I("micOff", 14, "vertical-align:-2px;color:#ff6a5a")} muted</div></div><div class="p"></div></div>

  }
  if (BOB_AT.a[S]) h += BOB(...BOB_AT.a[S]);
  return h;
}

// scratches and scuffs (fixed seed: the same every render)
function scratches(w, h, n, seed, col = "rgba(255,228,190,.16)") {
  let r = seed;
  const rnd = () => ((r = (r * 16807) % 2147483647) / 2147483647);
  let d = "";
  for (let i = 0; i < n; i++) {
    const x = rnd() * w, y = rnd() * h, a = rnd() * Math.PI, l = 8 + rnd() * 46;
    const cx = x + Math.cos(a) * l * 0.5 + (rnd() - 0.5) * 8, cy = y + Math.sin(a) * l * 0.5 + (rnd() - 0.5) * 8;
    d += `<path d='M${x.toFixed(1)} ${y.toFixed(1)} Q${cx.toFixed(1)} ${cy.toFixed(1)} ${(x + Math.cos(a) * l).toFixed(1)} ${(y + Math.sin(a) * l).toFixed(1)}' stroke='${col}' stroke-width='${(0.5 + rnd() * 0.9).toFixed(2)}' fill='none' stroke-linecap='round'/>`;
  }
  return svgURI(w, h, d);
}

    <rect x="11" y="11" width="${w - 22}" height="${h - 22}" rx="${Math.max(2, rad - 8)}" fill="none" stroke="#d6b483" stroke-width="2" stroke-dasharray="7 5" stroke-linecap="round" opacity=".85"/>
    <rect x="11" y="11" width="${w - 22}" height="${h - 22}" rx="${Math.max(2, rad - 8)}" fill="none" stroke="rgba(255,240,210,.5)" stroke-width=".8" stroke-dasharray="4 8" stroke-dashoffset="-1.5"/>
  </svg>`;
  return `<div class="abs" style="left:${x}px;top:${y}px;width:${w}px;height:${h}px;border-radius:${rad}px;
    background:${scratches(w, h, 70, seed)},radial-gradient(ellipse 70% 60% at 35% 30%,rgba(255,210,160,.16),transparent 70%),radial-gradient(ellipse at 50% 50%,transparent 62%,rgba(255,214,170,.12) 92%),${TX.leather};

    html += `<div class="abs a-sh" style="left:${lx}px;top:${ly}px;transform:translate(-50%,-50%);font:800 12px/1 'Inter Tight';letter-spacing:.16em;text-transform:uppercase;color:${g.on ? "#f3d27a" : "#fff"};white-space:nowrap;background:rgba(0,0,0,${g.on ? 0.6 : 0.42});padding:5px 9px;border-radius:2px">${g.cat}</div>`;

  // GTA's stats in the corner

  const SHOPS = [["gas", 306, -396, 328, -378], ["diner", 336, -396, 354, -382], ["market", 358, -396, 374, -380], ["books", 378, -396, 392, -382], ["bar", 448, -396, 464, -380], ["hardware", 468, -396, 482, -382], ["motors", 486, -396, 500, -382], ["post", 338, -430, 354, -414], ["laundry", 358, -428, 372, -414], ["hall", 378, -434, 404, -414], ["hotel", 432, -436, 452, -414], ["bakery", 458, -428, 472, -414]];
  const HOUSES = [];

  const rects = [...SHOPS.map((b) => b.slice(1)), ...HOUSES, [440, -320, 464, -302], [440, -262, 454, -250], [456, -536, 500, -508]].map(([a, b, c, d]) => [X(a), Y(b), X(c), Y(d)]);
  const near = (x, y, pad) => rects.some(([a, b, c, d]) => x > a - pad && x < c + pad && y > b - pad && y < d + pad);
