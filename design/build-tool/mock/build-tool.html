<style>
/* docs/plan/72-the-3d-core.md, phase 0: the free-form build tool. The classes are the live ones (apps/client/src/app/globals.css),

/* docs/plan/48-the-admin.md, phase 0. ?s=menu|people|person|invites|world|dark|perf|log|mobile
   The classes are the live ones (apps/client/src/app/globals.css), copied as they are. */
:root {
  --cream: #ece6da; --cream-dim: #a7a094; --paper: #ece5d3; --amber: #f1d79a; --vfd: #f1d79a;
  --rust: #c8553f; --ink: #1a1a1e; --muted: #8a857c; --panel: #17181d; --edge: #3a3631;
  --wood: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27600%27%20height=%27240%27%3E%3Cfilter%20id=%27g%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%270.006%200.22%27%20numOctaves=%273%27%20seed=%277%27/%3E%3CfeColorMatrix%20values=%270%200%200%200%200.55%200%200%200%200%200.36%200%200%200%200%200.2%201.1%200%200%200%20-0.35%27/%3E%3C/filter%3E%3Crect%20width=%27600%27%20height=%27240%27%20fill=%27%234e301b%27/%3E%3Crect%20width=%27600%27%20height=%27240%27%20filter=%27url(%23g)%27/%3E%3C/svg%3E");
  --edge-2: #46413a; --edge-cabinet: #4a443b; --well-edge: #2f2d2a; --field: #121318; --pit-2: #121318;
  --amber-shade: #8a7346; --amber-lo: #e0c07e; --on-amber: #1a1a1e; --good: #8aa04a; --warn: #e8a33d;
  --error: #e79a7c; --alert: #ff8a66; --scrim: #06080c9e; --track: #26262b;
  --font-mono: "Special Elite", ui-monospace, monospace; --font-title: "Cormorant Garamond", Georgia, serif; --font-body: Inter, system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #111216; color: var(--cream); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.bg { position: absolute; inset: 0; background: 0 0 / 100% 100% no-repeat; }
svg.i { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--font-mono); }
.title { font-family: var(--font-title); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--cream); line-height: 1.05; }
.zigzag { height: 6px; background-image: linear-gradient(135deg, var(--amber) 25%, transparent 25%), linear-gradient(225deg, var(--amber) 25%, transparent 25%); background-size: 8px 6px; opacity: .55; }
.cabinet { border: 5px solid transparent; border-radius: 6px; background: linear-gradient(var(--panel), var(--panel)) padding-box, var(--wood) 0 0 / 600px 240px border-box; box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.55), 0 12px 30px rgba(0,0,0,.5); }
.faceplate { background: var(--paper); color: var(--ink); border-radius: 4px; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.deck-btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-width: 44px; height: 36px; padding: 0 .8rem; border-radius: 6px; background: rgba(255,255,255,.04); border: 1px solid color-mix(in srgb, var(--amber) 16%, transparent); color: var(--cream); font-family: var(--font-mono); font-size: .78rem; letter-spacing: .02em; white-space: nowrap; }
.deck-btn.lit { background: var(--amber); border-color: transparent; color: var(--on-amber); box-shadow: 0 0 14px color-mix(in srgb, var(--amber) 35%, transparent); }
.deck-btn.danger { border-color: var(--rust); color: var(--error); }
.deck-btn:disabled { opacity: .45; cursor: not-allowed; }
.ghost-btn { border-radius: 4px; padding: .35rem .7rem; color: var(--cream-dim); font-family: var(--font-mono); font-size: .78rem; letter-spacing: .02em; border: 1px solid color-mix(in srgb, var(--amber) 20%, transparent); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.field { width: 100%; border-radius: 8px; background: var(--field); border: 1px solid var(--edge); color: var(--cream); padding: .55rem .75rem; font-size: .9rem; }
.field::placeholder { color: var(--muted); }
.card { border-radius: 4px; background: rgba(255,255,255,.025); border: 1px solid var(--well-edge); padding: 12px 16px; }
.sw { position: relative; width: 42px; height: 24px; border-radius: 12px; flex: none; background: rgba(255,255,255,.08); border: 1px solid color-mix(in srgb, var(--amber) 15%, transparent); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--cream-dim); }
.sw.on { background: color-mix(in srgb, var(--amber) 25%, transparent); border-color: var(--amber); }
.sw.on::after { left: 21px; background: var(--amber); box-shadow: 0 0 8px color-mix(in srgb, var(--amber) 80%, transparent); }
.slider { position: relative; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--amber-shade), var(--amber)) 0 0 / var(--v, 50%) 100% no-repeat, color-mix(in srgb, var(--amber) 14%, transparent); }
.slider::after { content: ""; position: absolute; left: calc(var(--v) - 8px); top: -6px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3cf, var(--amber-lo) 70%); box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.rail-item { position: relative; display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 12px; border-radius: 4px; font-size: 14px; color: var(--cream-dim); white-space: nowrap; width: 100%; text-align: left; }
.rail-item.sel { color: var(--amber); background: color-mix(in srgb, var(--amber) 9%, transparent); }
.rail-item.sel::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--amber); box-shadow: 0 0 8px color-mix(in srgb, var(--amber) 80%, transparent); }
.rail-item .n { margin-left: auto; font: 11px/1 var(--font-mono); color: var(--muted); }
.chip { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; color: var(--cream-dim); border: 1px solid var(--edge-2); white-space: nowrap; }
.chip.on { background: var(--vfd); border-color: var(--vfd); color: var(--ink); }
.seg { display: flex; gap: 3px; padding: 3px; border-radius: 9px; background: var(--field); border: 1px solid var(--edge-2); }
.seg > button { flex: 1; padding: 7px 10px; border-radius: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--cream-dim); white-space: nowrap; }
.seg > button.on { background: var(--vfd); color: var(--ink); }
.grp { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--vfd); }
.grp::after { content: ""; flex: 1; height: 1px; background: var(--edge-2); }
.toast { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 12px; border-radius: 999px; font-size: 14px; background: var(--panel); border: 1px solid var(--edge-cabinet); box-shadow: 0 8px 22px rgba(0,0,0,.45); --dot: var(--amber); }
.toast::before { content: ""; width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--dot); box-shadow: 0 0 8px var(--dot); }


/* the mock's own */
.abs { position: absolute; }
.row { display: flex; align-items: center; }
.grow { flex: 1; min-width: 0; }
.dim { color: var(--cream-dim); }
.mut { color: var(--muted); }
.lab { font: 11.5px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--vfd); }
.note { font-size: 12px; color: var(--muted); }
.scrim { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; }
.callout { position: absolute; font: 13px/1.35 var(--font-mono); color: var(--ink); background: var(--paper); padding: 8px 11px; border-radius: 3px; box-shadow: 0 6px 16px rgba(0,0,0,.45); max-width: 250px; transform: rotate(-1deg); z-index: 5; }
.callout::before { content: "▸ "; color: var(--rust); }
.keycap { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 4px; border: 1px solid currentColor; font-family: var(--font-mono); font-size: 10px; line-height: 1; opacity: .75; }
.ov { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
/* the toolbar */
.tool { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 66px; padding: 8px 0 6px; border-radius: 5px; color: var(--cream-dim); font: 11px/1 var(--font-mono); position: relative; }
.tool svg.i { width: 22px; height: 22px; }
.tool.sel { color: var(--ink); background: var(--amber); box-shadow: 0 0 14px color-mix(in srgb, var(--amber) 35%, transparent); }
.tool .k { position: absolute; top: 4px; right: 6px; font: 9px/1 var(--font-mono); opacity: .6; }
.vsep { width: 1px; align-self: stretch; margin: 6px 6px; background: var(--edge-2); }
.tray { display: flex; align-items: center; gap: 16px; padding: 10px 14px; }
.tray .sl { display: flex; align-items: center; gap: 10px; font: 11px/1 var(--font-mono); color: var(--cream-dim); text-transform: uppercase; letter-spacing: .06em; white-space: nowrap; }
.tray .sl .slider { width: 110px; }
.tray .sl b { color: var(--cream); font-weight: 400; min-width: 34px; }
.sw-row { display: flex; gap: 6px; }
.swatch { width: 54px; display: flex; flex-direction: column; align-items: center; gap: 5px; font: 10px/1 var(--font-mono); color: var(--cream-dim); }
.swatch i { width: 34px; height: 24px; border-radius: 3px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.4); }
.swatch.on i { outline: 2px solid var(--amber); outline-offset: 2px; }
.swatch.on { color: var(--amber); }
.pcard { border-radius: 4px; border: 1px solid var(--well-edge); background: rgba(255,255,255,.025); padding: 8px 6px 7px; display: flex; flex-direction: column; align-items: center; gap: 5px; font-size: 12px; color: var(--cream-dim); }
.pcard svg { width: 54px; height: 38px; }
.pcard.on { border-color: var(--amber); color: var(--amber); background: color-mix(in srgb, var(--amber) 8%, transparent); }
.prop { display: grid; grid-template-columns: 96px 1fr; gap: 10px 12px; align-items: center; font-size: 13px; }
.prop dt { color: var(--cream-dim); }
.pin { display: inline-flex; align-items: center; gap: 6px; padding: 4px 9px 4px 7px; border-radius: 999px; background: var(--panel); border: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); color: var(--amber); font: 11px/1 var(--font-mono); letter-spacing: .04em; white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,.45); position: absolute; }
.pin svg.i { width: 13px; height: 13px; }
.who { position: absolute; display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 3px; background: rgba(23,24,29,.86); font: 12px/1 var(--font-mono); color: var(--cream); white-space: nowrap; }
.chk { display: flex; gap: 10px; align-items: flex-start; font-size: 13px; padding: 6px 0; }
.chk b { width: 18px; flex: none; text-align: center; font-weight: 600; }
.stat b { display: block; font: 600 26px/1 var(--font-title); letter-spacing: .02em; }
.stat span { font: 10.5px/1.3 var(--font-mono); color: var(--cream-dim); text-transform: uppercase; letter-spacing: .06em; }
.rev { display: grid; grid-template-columns: 54px 1fr auto; gap: 14px; align-items: center; padding: 12px 10px; border-radius: 4px; }
.rev + .rev { border-top: 1px solid rgba(255,255,255,.05); }
.rev.hl { background: color-mix(in srgb, var(--amber) 7%, transparent); }
.rev .n { font: 600 24px/1 var(--font-title); color: var(--cream-dim); text-align: center; }
.rev.now .n { color: var(--amber); }
.tag { font: 10.5px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: 3px; border: 1px solid var(--edge-2); color: var(--cream-dim); white-space: nowrap; }
.tag.adm { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
.rail-item .n { margin-left: auto; font: 11px/1 var(--font-mono); color: var(--muted); }
/* the build tool's own */
.bar { position: absolute; left: 12px; right: 12px; top: 12px; height: 54px; display: flex; align-items: center; gap: 12px; padding: 0 10px 0 16px; }
.rec { width: 9px; height: 9px; border-radius: 50%; background: #e2553a; box-shadow: 0 0 8px #e2553a; display: inline-block; }
.lvl { display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px; border-radius: 4px; border: 1px solid var(--edge-2); font: 600 17px/1 var(--font-title); color: var(--cream); }
.lvl.on { background: var(--amber); color: var(--ink); border-color: transparent; }
.lvl small { font: 10px/1 var(--font-mono); letter-spacing: .02em; margin-left: 6px; opacity: .8; }
.lvl.on { display: inline-flex; align-items: center; padding: 0 9px; }
.rail { position: absolute; left: 12px; top: 76px; bottom: 12px; width: 76px; padding: 10px 6px; display: flex; flex-direction: column; gap: 6px; }
.rail .it { display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 9px 0 7px; border-radius: 6px; font: 10px/1 var(--font-mono); letter-spacing: .06em; color: var(--cream-dim); text-transform: uppercase; }
.rail .it.on { background: var(--amber); color: var(--ink); }
.panel { position: absolute; left: 96px; top: 76px; bottom: 12px; width: 350px; padding: 16px 16px 14px; overflow: hidden; }
.panel h2 { font: 600 24px/1 var(--font-title); letter-spacing: .12em; text-transform: uppercase; color: var(--amber); }
.tabs { display: flex; gap: 3px; padding: 3px; border-radius: 7px; background: var(--field); border: 1px solid var(--edge-2); }
.tabs > button { flex: 1; padding: 8px 4px; border-radius: 5px; font: 11.5px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--cream-dim); }
.tabs > button.on { background: var(--amber); color: var(--ink); }
.tabs > button i { display: block; margin: 0 auto 5px; width: 22px; height: 16px; }
.mats { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
.mat { height: 34px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.45); }
.mat.on { outline: 2px solid var(--amber); outline-offset: 2px; }
.kv { display: grid; grid-template-columns: 84px 1fr; gap: 9px 10px; align-items: center; font-size: 12.5px; }
.kv > dt { color: var(--cream-dim); }
.kv .seg > button { padding: 6px 4px; font-size: 10.5px; letter-spacing: .02em; }
.kv dd { min-width: 0; }
.new { font: 9px/1 var(--font-mono); letter-spacing: .08em; color: var(--ink); background: #9fcf6a; border-radius: 3px; padding: 2px 4px; margin-left: 6px; vertical-align: 1px; }
.ask { font: 9px/1 var(--font-mono); letter-spacing: .08em; color: var(--ink); background: var(--warn); border-radius: 3px; padding: 2px 4px; margin-left: 6px; vertical-align: 1px; }
.hint { position: absolute; bottom: 16px; left: calc(50% + 225px); transform: translateX(-50%); padding: 10px 18px; font-size: 14px; color: var(--cream-dim); white-space: nowrap; }
.hint b { color: var(--cream); font-weight: 500; }
.lbl { position: absolute; transform: translate(-50%, -50%); padding: 4px 9px; border-radius: 4px; background: rgba(23,24,29,.9); border: 1px solid color-mix(in srgb, var(--amber) 55%, transparent); font: 13px/1 var(--font-mono); color: var(--amber); white-space: nowrap; box-shadow: 0 4px 10px rgba(0,0,0,.4); }
.lbl.g { color: #b6e08a; border-color: #8fbf5e; }
.lbl.w { color: var(--cream); border-color: var(--edge-2); }
.lbl small { color: var(--cream-dim); margin-left: 6px; }
.typed { position: absolute; transform: translate(-50%, 0); padding: 6px 10px; border-radius: 4px; background: var(--amber); color: var(--ink); font: 14px/1 var(--font-mono); box-shadow: 0 4px 12px rgba(0,0,0,.4); white-space: nowrap; }
.typed::after { content: ""; display: inline-block; width: 2px; height: 14px; background: var(--ink); margin-left: 2px; vertical-align: -2px; animation: none; }
.menu { position: absolute; padding: 8px; width: 280px; }
.menu .r { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 8px 8px; border-radius: 4px; font-size: 13.5px; }
.menu .r.on { background: color-mix(in srgb, var(--amber) 14%, transparent); color: var(--amber); }
.menu .r .h { font: 11.5px/1 var(--font-mono); color: var(--cream-dim); }
.menu .r .n { font: 600 18px/1 var(--font-title); text-align: center; }
</style>

<script>
// docs/plan/72-the-3d-core.md, phase 0: the free-form build tool, mocked over the game's own 3D view (floor 3 of
// the studio, blank; the walls, arcs, slabs and ghosts drawn into its scene as real 3D — capture.spec.ts,
// shots.mjs). ?s=01-draw|02-snaps|03-arc|04-height|05-room|06-door|07-floor|08-level|09-stairs|10-thing
const P = {
  chair: "M7 4h10v8H7zM6 12h12v3H6zM8 15v5M16 15v5",
  walls: "M3 6h18v12H3zM3 12h18M9 6v6M15 12v6",
  rooms: "M3 3h8v8H3zM13 3h8v8h-8zM3 13h8v8H3zM13 13h8v8h-8z",
  tag: "M3 12V3h9l9 9-9 9zM7.5 7.5h.01",
  map: "M3.5 6l5.5-2.5 6 2.5 5.5-2.5V18l-5.5 2.5-6-2.5L3.5 20.5zM9 3.5V18M15 6v14.5",
  undo: "M9 6.5L4.5 11 9 15.5M4.5 11h10a5 5 0 0 1 0 10H11",
  redo: "M15 6.5l4.5 4.5-4.5 4.5M19.5 11h-10a5 5 0 0 0 0 10H13",
  check: "M5 12.5l4.5 4.5L19 7.5",
  line: "M4 18L20 6M4 18h.01M20 6h.01",
  arc: "M4 18C4 9 10 5 20 5",
  box: "M5 6h14v12H5z",
  erase: "M4 20h16M7 16l9-9 3 3-9 9H7z",
  poly: "M4 18l3-12 10 2 3 9z",
  fill: "M4 4h16v16H4zM8 8h8v8H8z",
  stairs: "M3.5 20.5h4v-4h4v-4h4v-4h5",
  lift: "M6 3h12v18H6zM10 8l2-2 2 2M10 16l2 2 2-2",
  up: "M12 19V5M6 11l6-6 6 6",
  down: "M12 5v14M6 13l6 6 6-6",
};
const ic = (k, s = 17) => `<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px"><path d="${P[k]}"/></svg>`;
const A = "#f1d79a", O = "#f2a43a", G = "#9fcf6a";
const shot = (n) => {
  document.getElementById("bg").style.backgroundImage = `url(bg/${n}.jpg)`;
  return window.ANCHORS[n];
};

// ── the chrome: build mode as it is, with the level for the floor picker ──────────────────────────────
function bar(level = "3") {
  const L = [["G", "0"], ["1", "3.5"], ["2", "7"], ["3", "10.5"], ["4", "14"]];
  return `<div class="cabinet bar">
      <span class="title" style="font-size:24px;letter-spacing:.2em">Yutopia</span>
      <div style="width:1px;align-self:stretch;margin:10px 4px;background:var(--edge-2)"></div>
      <span class="row" style="gap:9px"><i class="rec"></i><span class="title" style="font-size:20px;color:var(--amber)">Build mode</span><span class="dim" style="font-size:13px">Yutopia · Studio</span></span>
      <div style="width:1px;align-self:stretch;margin:10px 4px;background:var(--edge-2)"></div>
      <span class="lab">Level</span>
      <span class="row" style="gap:5px">${L.map(([n, h]) => `<span class="lvl ${n === level ? "on" : ""}">${n}${n === level ? `<small>${h} m</small>` : ""}</span>`).join("")}<span class="lvl" style="font:11px/1 var(--font-mono)">▾</span></span>
      <span class="grow"></span>
      <button class="deck-btn">${ic("undo", 15)}Undo</button><button class="deck-btn" disabled>${ic("redo", 15)}Redo</button>
      <span class="mut mono" style="font-size:11.5px">● Saved</span>
      <button class="deck-btn lit">${ic("check", 15)}Done</button>
    </div>`;
}
function rail(on) {
  const R = [["furnish", "Furnish", "chair"], ["walls", "Walls", "walls"], ["rooms", "Rooms", "rooms"], ["desks", "Desks", "tag"], ["map", "Map", "map"]];
  return `<div class="cabinet rail">${R.map(([id, l, i]) => `<div class="it ${id === on ? "on" : ""}">${ic(i, 22)}${l}</div>`).join("")}</div>`;
}
const panel = (title, inner) => `<div class="cabinet panel"><h2>${title}</h2><div class="zigzag" style="width:110px;margin:10px 0 14px"></div>${inner}</div>`;
const tabs = (opts, on) => `<div class="tabs">${opts.map((o) => `<button class="${o === on ? "on" : ""}">${o}</button>`).join("")}</div>`;
const itabs = (opts, on) => `<div class="tabs">${opts.map(([o, i, tag]) => `<button class="${o === on ? "on" : ""}"><i>${ic(i, 18)}</i>${o}${tag ?? ""}</button>`).join("")}</div>`;
const seg = (opts, on) => `<div class="seg">${opts.map((o) => `<button class="${o === on ? "on" : ""}">${o}</button>`).join("")}</div>`;
const grp = (t, m = "16px 0 9px") => `<div class="grp" style="margin:${m}">${t}</div>`;
const NEW = `<span class="new">new</span>`;
const ASK = `<span class="ask">ask</span>`;
const MATS = [["#e8e1d4", "Plaster"], ["#6b4a2c", "Walnut"], ["#b4553f", "Foam"], ["#9c4a36", "Brick"], ["#c49a6c", "Cork"], ["#7d9db0", "Glass"]];
const mats = (on = "Plaster") => `<div class="mats">${MATS.map(([c, n]) => `<div class="mat ${n === on ? "on" : ""}" style="background:${c}" title="${n}"></div>`).join("")}</div>`;
// the walls' panel: what draws, its snaps, its height
function wallsPanel(tool = "Line", o = {}) {
  return panel(
    "Walls & floors",
    tabs(["Build", "Paint", "Floors", "Select"], "Build") +
      `<div style="height:9px"></div>` +
      itabs([["Line", "line"], ["Arc", "arc", NEW], ["Box", "box"], ["Erase", "erase"]], tool) +
      grp("Walls") + mats(o.mat) +
      grp(`Snap ${o.snapTag ?? ""}`) +
      `<dl class="kv"><dt>Grid</dt><dd>${seg(["0.5 m", "1 m", "Off"], o.grid ?? "0.5 m")}</dd>
        <dt>Angles</dt><dd>${seg(["15°", "45°", "Off"], o.ang ?? "15°")}</dd>
        <dt>To walls</dt><dd class="row" style="gap:5px;flex-wrap:wrap">${["Ends", "Middles", "Square", "Lines"].map((k) => `<span class="chip on">${k}</span>`).join("")}</dd></dl>` +
      grp(`Height ${o.hTag ?? ""}`) +
      `<dl class="kv"><dt>Up to</dt><dd>${seg(["3.27 m", "Rail 1.1", "Low 0.6"], o.h ?? "3.27 m")}</dd>
        <dt>Thick ${ASK}</dt><dd>${seg(["0.1", "0.2 m", "0.3"], "0.2 m")}</dd></dl>` +
      `<div class="note" style="margin-top:14px;line-height:1.5">${o.note ?? "Click, click: a wall from each corner to the next. Enter or a double-click ends it; Esc takes the last corner back. Shift: no snaps."}</div>`,
  );
}
const hint = (t) => `<div class="cabinet hint">${t}</div>`;
const ov = (inner) => `<svg class="ov" viewBox="0 0 1440 900" preserveAspectRatio="none">${inner}</svg>`;
const co = (x, y, text, rot = -1, w = 250) => `<div class="callout" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg);max-width:${w}px">${text}</div>`;
const lbl = ([x, y], t, cls = "", dx = 0, dy = 0) => `<div class="lbl ${cls}" style="left:${x + dx}px;top:${y + dy}px">${t}</div>`;
// the snaps' marks, as the cursor finds them
const sEnd = ([x, y], c = O) => `<rect x="${x - 9}" y="${y - 9}" width="18" height="18" fill="#17181d" fill-opacity=".55" stroke="${c}" stroke-width="2.5"/>`;
const sMid = ([x, y], c = O) => `<path d="M${x} ${y - 11} L${x + 10} ${y + 7} L${x - 10} ${y + 7} Z" fill="#17181d" fill-opacity=".55" stroke="${c}" stroke-width="2.5"/>`;
const sSq = ([x, y], c = G) => `<path d="M${x - 10} ${y - 12} V${y + 2} H${x + 12}" fill="none" stroke="${c}" stroke-width="2.5"/><rect x="${x - 10}" y="${y - 4}" width="6" height="6" fill="none" stroke="${c}" stroke-width="2"/>`;
const sCur = ([x, y]) => `<circle cx="${x}" cy="${y}" r="12" fill="none" stroke="#fff" stroke-width="2"/><path d="M${x - 20} ${y}h12M${x + 8} ${y}h12M${x} ${y - 20}v12M${x} ${y + 8}v12" stroke="#fff" stroke-width="2"/>`;
const arrow = ([x0, y0], [x1, y1], c = "#fff") => `<path d="M${x0} ${y0} L${x1} ${y1}" stroke="${c}" stroke-width="2.5" marker-end="url(#ah)"/>`;
const defs = `<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#fff"/></marker></defs>`;

const S = {};

S["01-draw"] = () => {
  const a = shot("01-draw");
  return ov(defs + sEnd(a.p0) + sEnd(a.p1) + sEnd(a.p2) + sCur(a.cursor)) +
    lbl(a.len, "5.00 m", "", 0, 0) + lbl(a.ang, "150°", "w", -10, 10) +
    `<div class="typed" style="left:${a.cursor[0]}px;top:${a.cursor[1] + 26}px">5|</div>` +
    bar() + rail("walls") + wallsPanel("Line") +
    hint(`<b>Click</b> a corner · <b>type</b> a length · <b>Enter</b> ends · <b>Esc</b> takes a corner back`) +
    co(1080, 110, "Click, click, click: each click a corner, each wall going on from the last one. It's a chain until you end it.", 1, 260) +
    co(470, 640, "As it follows the pointer: its length and the angle it turns. Type a number to give the length (5 Enter); Tab moves to the angle.", -1.2, 270) +
    co(a.cursor[0] + 40, a.cursor[1] + 60, "The grid's points round the pointer (0.5 m), and the wall swings in 15° steps. Shift holding: free.", 1, 240);
};

S["02-snaps"] = () => {
  const a = shot("02-snaps");
  return ov(defs + sEnd(a.end) + sMid([a.mid[0], a.mid[1] + 145]) + sSq(a.sq) + sCur(a.foot)) +
    lbl(a.end, "End", "", 34, -18) + lbl([a.mid[0], a.mid[1] + 145], "Middle", "", 0, -30) + lbl(a.sq, "Square", "g", 54, 0) +
    lbl(a.ext, "On its line", "", -90, -10) + lbl(a.foot, "4.00 m", "", -60, 14) +
    bar() + rail("walls") + wallsPanel("Line", { snapTag: "· what it finds" }) +
    hint(`The pointer snaps to what's near; a mark says which. <b>Shift</b>: none`) +
    co(1090, 120, "To another wall: its ends, its middle, square off it (the green mark), its line carried on past its end (the dashes).", 1, 260) +
    co(560, 640, "One mark at a time, the nearest that fits; the grid only where no wall is near. The 15° steps count from the wall it starts on.", -1, 280);
};

S["03-arc"] = () => {
  const a = shot("03-arc");
  return ov(defs + sEnd(a.a) + sEnd(a.b) + sCur([a.bow[0], a.bow[1] + 150])) +
    lbl(a.bow, "r 4.00 m · 12.57 m long", "", 0, -18) + lbl(a.r, "bows 4.00 m", "w", 70, 30) +
    bar() + rail("walls") + wallsPanel("Arc", { note: "An arc: click its two ends, then how far it bows (the pointer, or type the radius). Its faces and its height as a straight wall's." }) +
    hint(`<b>Click</b> one end · <b>click</b> the other · <b>move</b> to bow it · <b>click</b>`) +
    co(1050, 300, "A curved wall: drawn in pieces along its curve, its faces painted as any wall's. Doors and windows go into it too (at its curve's angle).", 1, 260) +
    co(a.a[0] - 330, a.a[1] - 20, "Its ends snap as a straight wall's do; it bows by its middle, in 0.25 m steps, or to a half circle.", -1, 250);
};

S["04-height"] = () => {
  const a = shot("04-height");
  return ov(defs + arrow([a.top[0], a.top[1] + 4], [a.handle[0], a.handle[1] - 16]) + `<circle cx="${a.handle[0]}" cy="${a.handle[1]}" r="9" fill="#fff" stroke="#17181d" stroke-width="2"/>`) +
    lbl(a.handle, "1.10 m · a rail", "", 92, 0) + lbl(a.top, "3.27 m · up to the ceiling", "w", 0, -24) +
    bar() + rail("walls") + wallsPanel("Line", { h: "Rail 1.1", hTag: "· a wall's" }) +
    hint(`<b>Drag</b> a wall's top · <b>click</b> it for its own height · <b>Ctrl</b> for the whole chain`) +
    co(1050, 160, "A wall's height: up to the ceiling (the storey's 3.27), a rail at 1.1, low at 0.6, or any (dragged by its top, or typed).", 1, 260) +
    co(480, 560, "What it changes: what stops you and what you see over. A rail round a mezzanine is a wall 1.1 m high.", -1, 250);
};

S["05-room"] = () => {
  const a = shot("05-room");
  const card = `<div class="cabinet abs" style="right:24px;top:96px;width:300px;padding:14px 16px">
      <div class="row"><span class="lab grow">A room · 80 m²</span><span class="mut mono" style="font-size:10.5px">found</span></div>
      <div class="zigzag" style="width:80px;margin:8px 0 12px"></div>
      <dl class="kv"><dt>Name</dt><dd><input class="field" value="Studio B" style="padding:.35rem .6rem;font-size:13px"></dd>
        <dt>Kind</dt><dd>${seg(["Open", "Private", "Meet", "Booth"], "Private")}</dd>
        <dt>Owner</dt><dd>${seg(["None", "Me"], "Me")}</dd>
        <dt>Dressing</dt><dd>${seg(["None", "Tidy", "Lived"], "Tidy")}</dd></dl>
      <div class="row" style="gap:6px;margin-top:12px;justify-content:flex-end"><button class="deck-btn">Later</button><button class="deck-btn lit">${ic("check", 14)}Name it</button></div>
    </div>`;
  return ov(defs + sEnd(a.close, "#fff")) + lbl(a.mid, "80 m²", "w") + card +
    bar() + rail("walls") + wallsPanel("Line") +
    hint(`The chain closes on its first corner: <b>the room it closes round is found</b>`) +
    co(1060, 610, "A room is what its walls close round: found as you close it, any shape, its doorways counted as closed. Nothing to draw twice.", 1, 270) +
    co(500, 600, "Named now, or later in Rooms. Its kind, owner and lock as today's rooms have them; its walls can move, it follows.", -1, 250);
};

S["06-door"] = () => {
  const a = shot("06-door");
  const doors = panel("Doors & windows",
    tabs(["Doors", "Windows", "Openings"], "Doors") +
      `<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:12px">${["Wood", "Glass", "Double", "Barn", "Office", "Arch"].map((n, i) => `<div class="pcard ${i === 0 ? "on" : ""}" style="height:66px;justify-content:flex-end">${n}</div>`).join("")}</div>` +
      grp("This door") +
      `<dl class="kv"><dt>Width</dt><dd>${seg(["0.9", "1.0 m", "2.0"], "1.0 m")}</dd><dt>Opens</dt><dd>${seg(["In", "Out", "Slides"], "In")}</dd><dt>Snap</dt><dd class="row" style="gap:5px"><span class="chip on">Middle</span><span class="chip on">0.1 m</span><span class="chip on">Ends</span></dd></dl>` +
      `<div class="note" style="margin-top:14px;line-height:1.5">Put on a wall it stays on it: dragged, it slides along it, from end to end.</div>`);
  return ov(defs + arrow([a.door[0] - 12, a.door[1] - 2], [a.door[0] - 70, a.door[1] + 6]) + arrow([a.door[0] + 12, a.door[1] - 2], [a.door[0] + 70, a.door[1] - 6]) + sMid([a.mid[0], a.mid[1] + 6], G)) +
    lbl(a.left, "4.50 m", "w", 0, 16) + lbl(a.right, "4.50 m", "w", 0, 16) + lbl(a.door, "the middle", "g", 0, -26) +
    bar() + rail("furnish") + doors +
    hint(`<b>Drag</b> it along its wall · <b>click</b> another wall to move it there · <b>R</b> which way it opens`) +
    co(1070, 160, "A door or a window slides along the wall it's in: its distance to each end shown, snapping to the middle, 0.1 m, an end less its frame.", 1, 260) +
    co(500, 640, "Any wall, straight or curved; it cuts its hole wherever it stops. Today's are fixed to the 1 m grid.", -1, 240);
};

S["07-floor"] = () => {

  const floors = panel("Walls & floors",
    tabs(["Build", "Paint", "Floors", "Select"], "Floors") + `<div style="height:9px"></div>` +

    grp("At") + `<dl class="kv"><dt>Height</dt><dd>${seg(["On level", "+0.6", "+1.75 m"], "+1.75 m")}</dd><dt>Thick</dt><dd>${seg(["0.2", "0.3 m"], "0.3 m")}</dd></dl>` +
    grp("Floor") + `<div class="mats">${["#8a5a34", "#c8b48e", "#e8dcc4", "#5f6b4c", "#3b3f45", "#a9a49b"].map((c, i) => `<div class="mat ${i === 0 ? "on" : ""}" style="background:${c}"></div>`).join("")}</div>` +

    <div class="abs" style="left:24px;right:24px;top:72px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px">
      ${card("1", "Arcs in the first version?", pic("03-arc", 130, "60% 40%") + opt("Yes: ends snap as a straight wall's, it bows by its middle (0.25 m steps, or a half circle); doors and windows go in it", true) + opt("Later: straight walls first", false), "yes (the ask had them)")}
      ${card("2", "Walls of different thickness?", pic("14-thick", 130, "50% 55%") + opt("One: 0.2 m, as today", false) + opt("Three: 0.1 (a partition), 0.2, 0.3 (outer)", true) + opt("Any, typed", false), "three")}
      ${card("3", "Pitched roofs now or later?", pic("15-roof", 130, "48% 62%") + opt("Now: a gable or a hip drawn over a closed set of walls (outdoors)", false) + opt("Later: flat roofs (a slab) first; pitched with the houses after", true), "later")}
      ${card("4", "A post where walls meet?", `<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px">${pic("13-post-off", 120, "40% 50%")}${pic("13-post-on", 120, "40% 50%")}</div>` + opt("None: the walls meet, mitred (the seam shows at an angle)", false) + opt("A post at every corner that isn't straight on (today's posts are at every joint)", true), "a post where it isn't 180°")}
      ${card("5", "A wall across a room splits it: which keeps it?", `<svg viewBox="0 0 300 110" style="width:100%;height:120px;background:#121318;border-radius:4px"><rect x="20" y="15" width="260" height="80" fill="#f1d79a" fill-opacity=".12" stroke="#ece6da" stroke-width="2"/><path d="M110 15V95" stroke="#f2a43a" stroke-width="4"/><text x="50" y="60" fill="#ece6da" font-size="12" font-family="Special Elite">Studio B</text><text x="160" y="52" fill="#f1d79a" font-size="12" font-family="Special Elite">Studio B</text><text x="160" y="68" fill="#a7a094" font-size="10" font-family="Special Elite">keeps name, owner, lock</text><text x="34" y="78" fill="#a7a094" font-size="10" font-family="Special Elite">a new room</text></svg>` + opt("The bigger part keeps it (name, owner, lock); the other is a new room, unnamed", true) + opt("Both new, asked to name them", false) + opt("It stays one room till you say", false), "the bigger part keeps it")}
      ${card("6", "What's a “level” in the HUD?", `<div style="display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font:12.5px/1.2 var(--font-mono);color:var(--cream-dim);padding:6px 8px;background:#121318;border-radius:4px"><span class="lvl" style="width:24px;height:24px">4</span><span>Floor 4 · 14.00</span><span class="lvl" style="width:24px;height:24px">↳</span><span style="color:var(--amber)">Mezzanine · 12.25</span><span class="lvl on" style="width:24px;height:24px">3</span><span>Floor 3 · 10.50</span></div>` + opt("The floors, each a level at its height; a slab between them a level under its floor; PgUp/PgDn step through, “a height of its own” for any", true) + opt("Just a height (a slider), no names", false), "the floors and what's between")}
    </div>
    ${co(24, 836, "Plus the defaults: snaps on (Shift off), 15° steps, 0.5 m grid — and things free at any turn with 15° steps on R.", -0.5, 640)}`;
};

// ── the reel: a room drawn wall by wall (frames reel-00…; ?s=reel&f=12) ─────────────────────────────
S.reel = () => {
  const f = String(new URLSearchParams(location.search).get("f") ?? "0").padStart(2, "0");
  const n = `reel-${f}`;
  const a = shot(n);
  const R = window.REEL[n];
  const found = R.found !== undefined;
  const w = R.wall ?? 4;
  const steps = ["First wall", "Second", "Third", "Closing it", "Room found"];
  const card = found && R.found >= 3 ? `<div class="cabinet abs" style="right:24px;top:96px;width:300px;padding:14px 16px;opacity:${Math.min(1, (R.found - 2) / 3)}">
      <div class="row"><span class="lab grow">A room · 80 m²</span><span class="mut mono" style="font-size:10.5px">found</span></div>
      <div class="zigzag" style="width:80px;margin:8px 0 12px"></div>
      <dl class="kv"><dt>Name</dt><dd><input class="field" value="${"Studio B".slice(0, Math.max(0, R.found - 2) * 2)}" style="padding:.35rem .6rem;font-size:13px"></dd><dt>Kind</dt><dd>${seg(["Open", "Private", "Meet"], "Open")}</dd></dl></div>` : "";
  return ov(defs + (found ? "" : sCur(a.cur))) + (found ? lbl(a.mid, "80 m²", "w") : lbl(a.len, `${R.len} m`, "")) + card +
    bar() + rail("walls") + wallsPanel("Line") +
    hint(found ? `The chain closed: <b>the room it closes round is found</b>` : `<b>${steps[w]}</b> · click a corner · the next wall goes on from it`);
};

const s = new URLSearchParams(location.search).get("s") || "01-draw";
document.getElementById("app").innerHTML = (S[s] ?? S["01-draw"])();
</script>
