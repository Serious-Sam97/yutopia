<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Yutopia, the admin panel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&family=Special+Elite&display=block" rel="stylesheet">
<style>
/* docs/plan/48-the-admin.md, phase 0. ?s=menu|people|person|invites|world|dark|perf|log|mobile
   The classes are the live ones (apps/client/src/app/globals.css), copied as they are. */
:root {
  --cream: #ece6da; --cream-dim: #a7a094; --paper: #ece5d3; --amber: #f1d79a; --vfd: #f1d79a;
  --rust: #c8553f; --ink: #1a1a1e; --muted: #8a857c; --panel: #17181d; --edge: #3a3631;
  --wood: url("data:image/svg+xml,%3Csvg%20xmlns=%27http://www.w3.org/2000/svg%27%20width=%27600%27%20height=%27240%27%3E%3Cfilter%20id=%27g%27%3E%3CfeTurbulence%20type=%27fractalNoise%27%20baseFrequency=%270.006%200.22%27%20numOctaves=%273%27%20seed=%277%27/%3E%3CfeColorMatrix%20values=%270%200%200%200%200.55%200%200%200%200%200.36%200%200%200%200%200.2%201.1%200%200%200%20-0.35%27/%3E%3C/filter%3E%3Crect%20width=%27600%27%20height=%27240%27%20fill=%27%234e301b%27/%3E%3Crect%20width=%27600%27%20height=%27240%27%20filter=%27url(%23g)%27/%3E%3C/svg%3E");
  --edge-2: #46413a; --edge-cabinet: #4a443b; --well-edge: #2f2d2a; --field: #121318; --pit-2: #121318;
  --amber-shade: #8a7346; --amber-lo: #e0c07e; --on-amber: #1a1a1e; --good: #8aa04a; --warn: #e8a33d;
  --error: #e79a7c; --alert: #ff8a66; --scrim: #06080c9e; --track: #26262b;
  --font-mono: "Special Elite", ui-monospace, monospace; --font-title: "Cormorant Garamond", Georgia, serif; --font-body: Inter, system-ui, sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #111216; color: var(--cream); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
.bg { position: absolute; inset: 0; background: url(../../ui/final-live/desk-day-lot.png) 0 0 / 100% 100% no-repeat; }
html.m .bg { background-image: url(../../ui/final-live/phone-day-lot.png); }
svg.i { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.mono { font-family: var(--font-mono); }
.title { font-family: var(--font-title); font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--cream); line-height: 1.05; }
.zigzag { height: 6px; background-image: linear-gradient(135deg, var(--amber) 25%, transparent 25%), linear-gradient(225deg, var(--amber) 25%, transparent 25%); background-size: 8px 6px; opacity: .55; }
.cabinet { border: 5px solid transparent; border-radius: 6px; background: linear-gradient(var(--panel), var(--panel)) padding-box, var(--wood) 0 0 / 600px 240px border-box; box-shadow: inset 0 0 0 1px rgba(0,0,0,.6), 0 0 0 1px rgba(0,0,0,.55), 0 12px 30px rgba(0,0,0,.5); }
.faceplate { background: var(--paper); color: var(--ink); border-radius: 4px; box-shadow: 0 6px 16px rgba(0,0,0,.35); }
.deck-btn { display: inline-flex; align-items: center; justify-content: center; gap: .4rem; min-width: 44px; height: 36px; padding: 0 .8rem; border-radius: 6px; background: rgba(255,255,255,.04); border: 1px solid color-mix(in srgb, var(--amber) 16%, transparent); color: var(--cream); font-family: var(--font-mono); font-size: .78rem; letter-spacing: .02em; white-space: nowrap; }
.deck-btn.lit { background: var(--amber); border-color: transparent; color: var(--on-amber); box-shadow: 0 0 14px color-mix(in srgb, var(--amber) 35%, transparent); }
.deck-btn.danger { border-color: var(--rust); color: var(--error); }
.deck-btn:disabled { opacity: .45; cursor: not-allowed; }
.ghost-btn { border-radius: 4px; padding: .35rem .7rem; color: var(--cream-dim); font-family: var(--font-mono); font-size: .78rem; letter-spacing: .02em; border: 1px solid color-mix(in srgb, var(--amber) 20%, transparent); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.field { width: 100%; border-radius: 8px; background: var(--field); border: 1px solid var(--edge); color: var(--cream); padding: .55rem .75rem; font-size: .9rem; }
.field::placeholder { color: var(--muted); }
.card { border-radius: 4px; background: rgba(255,255,255,.025); border: 1px solid var(--well-edge); padding: 12px 16px; }
.sw { position: relative; width: 42px; height: 24px; border-radius: 12px; flex: none; background: rgba(255,255,255,.08); border: 1px solid color-mix(in srgb, var(--amber) 15%, transparent); }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: var(--cream-dim); }
.sw.on { background: color-mix(in srgb, var(--amber) 25%, transparent); border-color: var(--amber); }
.sw.on::after { left: 21px; background: var(--amber); box-shadow: 0 0 8px color-mix(in srgb, var(--amber) 80%, transparent); }
.slider { position: relative; height: 4px; border-radius: 2px; background: linear-gradient(90deg, var(--amber-shade), var(--amber)) 0 0 / var(--v, 50%) 100% no-repeat, color-mix(in srgb, var(--amber) 14%, transparent); }
.slider::after { content: ""; position: absolute; left: calc(var(--v) - 8px); top: -6px; width: 16px; height: 16px; border-radius: 50%; background: radial-gradient(circle at 35% 30%, #fff3cf, var(--amber-lo) 70%); box-shadow: 0 1px 3px rgba(0,0,0,.6); }
.rail-item { position: relative; display: flex; align-items: center; gap: 11px; height: 38px; padding: 0 12px; border-radius: 4px; font-size: 14px; color: var(--cream-dim); white-space: nowrap; width: 100%; text-align: left; }
.rail-item.sel { color: var(--amber); background: color-mix(in srgb, var(--amber) 9%, transparent); }
.rail-item.sel::before { content: ""; position: absolute; left: 0; top: 8px; bottom: 8px; width: 2px; background: var(--amber); box-shadow: 0 0 8px color-mix(in srgb, var(--amber) 80%, transparent); }
.rail-item .n { margin-left: auto; font: 11px/1 var(--font-mono); color: var(--muted); }
.chip { font-family: var(--font-mono); font-size: 11px; letter-spacing: .06em; text-transform: uppercase; padding: 4px 10px; border-radius: 999px; color: var(--cream-dim); border: 1px solid var(--edge-2); white-space: nowrap; }
.chip.on { background: var(--vfd); border-color: var(--vfd); color: var(--ink); }
.seg { display: flex; gap: 3px; padding: 3px; border-radius: 9px; background: var(--field); border: 1px solid var(--edge-2); }
.seg > button { flex: 1; padding: 7px 10px; border-radius: 6px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .05em; text-transform: uppercase; color: var(--cream-dim); white-space: nowrap; }
.seg > button.on { background: var(--vfd); color: var(--ink); }
.grp { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--vfd); }
.grp::after { content: ""; flex: 1; height: 1px; background: var(--edge-2); }
.toast { display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 12px; border-radius: 999px; font-size: 14px; background: var(--panel); border: 1px solid var(--edge-cabinet); box-shadow: 0 8px 22px rgba(0,0,0,.45); --dot: var(--amber); }
.toast::before { content: ""; width: 8px; height: 8px; flex: none; border-radius: 50%; background: var(--dot); box-shadow: 0 0 8px var(--dot); }

/* the mock's own */
.abs { position: absolute; }
.row { display: flex; align-items: center; }
.grow { flex: 1; min-width: 0; }
.dim { color: var(--cream-dim); }
.mut { color: var(--muted); }
.lab { font: 11.5px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; color: var(--vfd); }
.scrim { position: absolute; inset: 0; background: var(--scrim); display: grid; place-items: center; }
.face { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; color: #fff; font: 600 12px/1 Inter; flex: none; position: relative; box-shadow: inset 0 0 0 1px rgba(0,0,0,.35); }
.face.big { width: 64px; height: 64px; font-size: 22px; }
.face i { position: absolute; right: -1px; bottom: -1px; width: 10px; height: 10px; border-radius: 50%; background: var(--good); border: 2px solid var(--panel); }
.face i.off { background: #4a4740; } .face i.away { background: #d8b45a; }
.tag { font: 10.5px/1 var(--font-mono); letter-spacing: .06em; text-transform: uppercase; padding: 3px 7px; border-radius: 3px; border: 1px solid var(--edge-2); color: var(--cream-dim); white-space: nowrap; }
.tag.adm { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 45%, transparent); }
.tag.bad { color: var(--error); border-color: color-mix(in srgb, var(--rust) 70%, transparent); }
.tag.you { color: var(--ink); background: var(--cream-dim); border-color: transparent; }
.prow { gap: 12px; padding: 9px 10px; border-radius: 4px; }
.prow + .prow { border-top: 1px solid rgba(255,255,255,.04); }
.prow.hl { background: color-mix(in srgb, var(--amber) 7%, transparent); }
.prow .nm { font-size: 14.5px; font-weight: 500; }
.prow .sub { font-size: 12.5px; color: var(--cream-dim); margin-top: 2px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 14px; font-size: 13.5px; }
.kv dt { color: var(--cream-dim); }
.line { gap: 12px; padding: 10px 0; }
.line + .line { border-top: 1px solid rgba(255,255,255,.05); }
.line .t { font-size: 14.5px; }
.line .s { font-size: 12.5px; color: var(--cream-dim); margin-top: 2px; }
.note { font-size: 12px; color: var(--muted); }
.stat b { display: block; font: 600 30px/1 var(--font-title); letter-spacing: .02em; }
.stat span { font: 11px/1.3 var(--font-mono); color: var(--cream-dim); text-transform: uppercase; letter-spacing: .06em; }
.bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--amber); }
.callout { position: absolute; font: 13px/1.35 var(--font-mono); color: var(--ink); background: var(--paper); padding: 8px 11px; border-radius: 3px; box-shadow: 0 6px 16px rgba(0,0,0,.45); max-width: 240px; transform: rotate(-1deg); }
.callout::before { content: "▸ "; color: var(--rust); }
.menuitem { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 4px; font-size: 14px; text-align: left; }
.menuitem.hov { background: rgba(255,255,255,.05); }
.keycap { display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 4px; border: 1px solid currentColor; font-family: var(--font-mono); font-size: 10px; line-height: 1; opacity: .75; }
</style>
</head>
<body>
<div class="bg"></div>
<div id="app"></div>
<script>
const P = {
  people: "M9 5.3a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 1 0 0-6.4M3.5 19c.6-3.3 2.8-5 5.5-5s4.9 1.7 5.5 5M16.5 7a2.5 2.5 0 1 0 0 5 2.5 2.5 0 1 0 0-5M15.5 14.2c2.6-.3 4.5 1.3 5 4.3",
  key: "M8 16a4 4 0 1 1 0-8 4 4 0 0 1 0 8zM12 12h9M18 12v3M21 12v2",
  home: "M4 20V9l8-5 8 5v11M9 20v-6h6v6",
  moon: "M19.5 14.5A8 8 0 1 1 9.5 4.5a6.3 6.3 0 0 0 10 10z",
  screen: "M3 4h18v12H3zM12 13V7.5M9.5 10l2.5-2.5 2.5 2.5M8 20h8M12 16v4",
  board: "M3 4h18v16H3zM9 4v16M15 4v16M5 7.5h2M11 7.5h2M17 7.5h2M5 10.5h2M11 10.5h2M5 13.5h2",
  gear: "M19.2 9.9L22.0 10.2L22.0 13.8L19.2 14.1L17.4 17.2L18.6 19.8L15.5 21.6L13.8 19.3L10.2 19.3L8.5 21.6L5.4 19.8L6.6 17.2L4.8 14.1L2.0 13.8L2.0 10.2L4.8 9.9L6.6 6.8L5.4 4.2L8.5 2.4L10.2 4.7L13.8 4.7L15.5 2.4L18.6 4.2L17.4 6.8zM12 9.2a2.8 2.8 0 1 0 0 5.6 2.8 2.8 0 1 0 0-5.6",
  leave: "M14 4H6v16h8M10 12h10M17 9l3 3-3 3",
  search: "M10.5 4.5a6 6 0 1 0 0 12 6 6 0 1 0 0-12M15 15l5 5",
  lock: "M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 7 0v3",
  unlock: "M6 11h12v9H6zM8.5 11V8a3.5 3.5 0 0 1 6.8-1.2",
  walk: "M13 4.5a1.5 1.5 0 1 0 0 .01M10 21l2-6 3 3v3M8 12l3-4 3 2 3 1M11 8l1 7",
  follow: "M5 12h12M13 7l5 5-5 5",
  micOff: "M9 3h6v11H9zM5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7M4 4l16 16",
  mic: "M9 3h6v11H9zM5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21M8.5 21h7",
  clock: "M12 3.5a8.5 8.5 0 1 0 0 17 8.5 8.5 0 1 0 0-17M12 7.5V12l3 2",
  copy: "M8 8h12v12H8zM16 8V5.5A1.5 1.5 0 0 0 14.5 4h-9A1.5 1.5 0 0 0 4 5.5v9A1.5 1.5 0 0 0 5.5 16H8",
  bin: "M4.5 6.5h15M9.5 6.5V4h5v2.5M6.5 6.5l1 13.5h9l1-13.5M10 10v6.5M14 10v6.5",
  send: "M4 12l16-7-6 15-2.5-6z",
  external: "M14 4h6v6M20 4l-9 9M18 14v4.5A1.5 1.5 0 0 1 16.5 20h-11A1.5 1.5 0 0 1 4 18.5v-11A1.5 1.5 0 0 1 5.5 6H10",
  chev: "M7 10l5 5 5-5",
  open: "M10 7l5 5-5 5",
  back: "M15 6l-6 6 6 6",
  door: "M3 21h18M5.5 21V3.5h13V21M8.5 21V6.5h7V21M13 14h.6",
  tv: "M3 8h18v12H3zM8 3l4 5 4-5M6 11h9v6H6zM18 12v1M18 15v1",
  room: "M4 20V4h16v16zM4 12h7M14 12h6M11 4v5M11 15v5",
  bay: "M4 4h16v16H4zM10 17V7h3a3 3 0 0 1 0 6h-3",
  shuffle: "M4 7h3.5c4 0 5 10 9 10H20M4 17h3.5c1.4 0 2.4-1.2 3.3-2.8M13.2 9.8C14.1 8.2 15.1 7 16.5 7H20M17.5 4.5 20 7l-2.5 2.5M17.5 14.5 20 17l-2.5 2.5",
  plus: "M12 5v14M5 12h14",
  check: "M5 12.5l4.5 4.5L19 7.5",
  bolt: "M13 3 5 13.5h6L10 21l8-10.5h-6z",
  wing: "M3 14c4-1 7-4 9-9 1 5 4 8 9 9-4 .5-6.5 2-9 5-2.5-3-5-4.5-9-5z",
  ghost: "M6 20V10a6 6 0 0 1 12 0v10l-2-1.5-2 1.5-2-1.5-2 1.5-2-1.5zM10 10h.01M14 10h.01",
  fast: "M4 8h7M2 12h9M4 16h7M14 6l6 6-6 6",
  heart: "M12 20s-7.5-4.6-7.5-10A4.3 4.3 0 0 1 12 7.2 4.3 4.3 0 0 1 19.5 10c0 5.4-7.5 10-7.5 10z",
  wall: "M3 5h18v14H3zM3 9.7h18M3 14.3h18M9 5v4.7M15 5v4.7M6 9.7v4.6M12 9.7v4.6M18 9.7v4.6M9 14.3V19M15 14.3V19",
  car: "M5 16.5h14M3.5 16.5v-4l2-5h13l2 5v4M7 19a1.5 1.5 0 1 0 0-.01M17 19a1.5 1.5 0 1 0 0-.01M5.5 12h13",
  mug: "M5 8h11v8.5a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3zM16 10h1.5a2.5 2.5 0 0 1 0 5H16M8 4.5c0 1 1 1.2 1 2.2M11.5 4.5c0 1 1 1.2 1 2.2",
  pin: "M12 21s-6.5-6-6.5-11a6.5 6.5 0 0 1 13 0c0 5-6.5 11-6.5 11zM12 7.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 1 0 0-5",
  snow: "M12 3v18M4.2 7.5l15.6 9M4.2 16.5l15.6-9M9.5 4.5 12 7l2.5-2.5M9.5 19.5 12 17l2.5 2.5",
};
const ic = (n, s = 17) => `<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px"><path d="${P[n]}"/></svg>`;
const face = (ini, hue, st = "on", cls = "") => `<span class="face ${cls}" style="background:hsl(${hue} 32% 42%)">${ini}${st ? `<i class="${st}"></i>` : ""}</span>`;

const PAGES = [
  ["people", "People", "people", "Who's in, everyone who has an account, and what you can do about them.", "4 in · 23"],
  ["powers", "Powers", "bolt", "What you can do as yourself. Each lasts until you switch it off or leave.", "2 on"],
  ["spawn", "Spawn", "plus", "Put something into the world, near you. Nothing here is saved.", ""],
  ["invites", "Invites", "key", "Single-use sign-up links. Each lets one person make an account.", "3 open"],
  ["world", "The world", "home", "What the whole town feels: the hour, the weather, locks, vehicles, a notice.", ""],
  ["dark", "The dark", "moon", "For trying the fight: what's out there, and you.", ""],
  ["perf", "Performance", "screen", "How it runs for everyone, this week.", ""],
  ["log", "The log", "board", "What admins did, and when. Kept 90 days.", ""],
];

// ── the pages ────────────────────────────────────────────────────────────────
const LIVE = [
  ["Ana Prado", "AP", 18, "on", "The Studio · Floor 2", ["you", "admin"]],
  ["Bia Demo", "BD", 200, "on", "Parking lot", ["muted"]],
  ["Caio Ramos", "CR", 120, "away", "The Kart Park · paddock", []],
  ["Duda Lins", "DL", 300, "on", "War room · Floor 3", []],
];
const ALL = [
  ["Enzo Moura", "EM", 40, "Last seen 2 h ago", ["removed · 6 min"]],
  ["Lia Torres", "LT", 160, "Last seen yesterday", []],
  ["Marcos Vale", "MV", 260, "Last seen 3 days ago", ["admin"]],
  ["Rafa Nunes", "RN", 80, "Last seen 6 days ago", []],
  ["Teo Sá", "TS", 220, "Never came in · joined 2 weeks ago", []],
];
const tags = (t) => t.map((x) => `<span class="tag ${x === "admin" ? "adm" : x === "you" ? "you" : /muted|removed/.test(x) ? "bad" : ""}">${x}</span>`).join("");

function people() {
  const row = ([n, ini, h, st, where, t], i) => `
    <div class="row prow ${i === 1 ? "hl" : ""}">
      ${face(ini, h, st)}
      <div class="grow"><div class="row" style="gap:8px"><span class="nm">${n}</span>${tags(t)}</div>
        <div class="sub">${where}</div></div>
      ${t.includes("you") ? "" : `<button class="ghost-btn">${ic("walk", 14)}Go to</button>`}
      <button class="ghost-btn">${ic("open", 14)}</button>
    </div>`;
  const off = ([n, ini, h, seen, t]) => `
    <div class="row prow">
      ${face(ini, h, "off")}
      <div class="grow"><div class="row" style="gap:8px"><span class="nm" style="color:var(--cream-dim)">${n}</span>${tags(t)}</div>
        <div class="sub">${seen}</div></div>
      ${t[0]?.startsWith("removed") ? `<button class="ghost-btn">Let back in</button>` : ""}
      <button class="ghost-btn">${ic("open", 14)}</button>
    </div>`;
  return `
    <div class="row" style="gap:10px">
      <div class="grow" style="position:relative">
        <span class="abs mut" style="left:11px;top:9px">${ic("search", 16)}</span>
        <input class="field" style="padding-left:34px" placeholder="Search by name or email">
      </div>
      <div class="row" style="gap:6px">
        <span class="chip on">Everyone</span><span class="chip">In now</span><span class="chip">Admins</span><span class="chip">Removed</span>
      </div>
    </div>
    <div class="grp" style="margin:16px 0 6px">In now · 4</div>
    ${LIVE.map(row).join("")}
    <div class="grp" style="margin:16px 0 6px">Not in · 19</div>
    ${ALL.map(off).join("")}
    <p class="note" style="padding:8px 10px">…and 14 more. Scroll for them, or search.</p>`;
}

function person() {
  return `
    <button class="ghost-btn" style="margin-bottom:12px">${ic("back", 14)}People</button>
    <div class="row" style="gap:16px">
      ${face("BD", 200, "on", "big")}
      <div class="grow">
        <div class="row" style="gap:8px"><span class="title" style="font-size:24px;letter-spacing:.08em;text-transform:none">Bia Demo</span>${tags(["muted"])}</div>
        <div class="dim" style="font-size:13.5px;margin-top:4px">bia@example.com · joined 12 Oct · in now, the Parking lot</div>
      </div>
    </div>
    <div class="row" style="gap:8px;margin-top:16px;flex-wrap:wrap">
      <button class="deck-btn">${ic("walk", 15)}Go to</button>
      <button class="deck-btn">${ic("follow", 15)}Bring here</button>
      <button class="deck-btn">${ic("people", 15)}Follow</button>
    </div>
    <div class="card" style="margin-top:14px">

        <div class="zigzag" style="width:120px;margin:10px 0 12px"></div>
        <div class="row" style="gap:4px;overflow:hidden">
          ${PAGES.map(([pid, label, icon]) => `<button class="rail-item ${pid === "people" ? "sel" : ""}" style="width:auto;height:34px;padding:0 10px;font-size:13px">${ic(icon, 15)}${label}</button>`).join("")}
        </div>
      </div>
      <div style="padding:12px 14px;overflow:hidden;flex:1">
        <div style="position:relative"><span class="abs mut" style="left:11px;top:9px">${ic("search", 16)}</span><input class="field" style="padding-left:34px" placeholder="Search"></div>
        <div class="row" style="gap:5px;margin-top:8px;overflow:hidden"><span class="chip on">Everyone</span><span class="chip">In now</span><span class="chip">Admins</span><span class="chip">Removed</span></div>
        <div class="grp" style="margin:14px 0 4px">In now · 4</div>
        ${LIVE.map(([n, ini, h, st, where, t], i) => `<div class="row prow ${i === 1 ? "hl" : ""}" style="padding:8px 4px">${face(ini, h, st)}<div class="grow"><div class="row" style="gap:6px"><span class="nm" style="font-size:14px">${n}</span>${tags(t.filter((x) => x !== "you"))}</div><div class="sub">${where}</div></div><span class="dim">${ic("open", 15)}</span></div>`).join("")}
        <div class="grp" style="margin:14px 0 4px">Not in · 19</div>
        ${ALL.slice(0, 4).map(([n, ini, h, seen, t]) => `<div class="row prow" style="padding:8px 4px">${face(ini, h, "off")}<div class="grow"><div class="row" style="gap:6px"><span class="nm" style="font-size:14px;color:var(--cream-dim)">${n}</span>${tags(t)}</div><div class="sub">${seen}</div></div><span class="dim">${ic("open", 15)}</span></div>`).join("")}
      </div>
    </section></div>`;
}

const s = new URLSearchParams(location.search).get("s") || "people";
document.getElementById("app").innerHTML = s === "menu" ? menu() : s === "mobile" ? mobile() : s === "flying" ? flying() : panel(s);
</script>
</body>
</html>
