     with the mock house drawn into it (capture.mts → bg/, anchors.json).  house-build.html?s=<shot>  ·  node render.mjs -->
<html lang="en" data-look="c">
<head>

<title>House build mocks</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1440px;height:900px;overflow:hidden}
body{position:relative;background:#222 center/cover no-repeat;-webkit-font-smoothing:antialiased;font-family:Nunito,sans-serif;color:var(--tx)}
:root{--pn:rgba(226,240,252,.93);--pn2:#fff;--tx:#123e6a;--dim:#5b7a9b;--acc:#2a84dc;--on:#fff;--hair:rgba(42,132,220,.18);--hair2:rgba(42,132,220,.36);
  --tile:linear-gradient(180deg,#fff,#e6f1fb);--tileOn:linear-gradient(180deg,#e0f0ff,#b9dbfa);--r:20px;--rb:999px;--good:#3fae3a;--bad:#e0442c;--amber:#f29a1a}
.pn{position:absolute;background:var(--pn);border-radius:var(--r);border:1.5px solid rgba(255,255,255,.95);box-shadow:0 10px 30px rgba(10,50,100,.35),inset 0 1px 0 #fff,inset 0 -10px 24px rgba(120,170,220,.25);backdrop-filter:blur(8px)}
.pn>*{position:relative;z-index:1}
.pn::before{content:"";z-index:0;position:absolute;left:10px;right:10px;top:3px;height:38%;border-radius:16px 16px 40% 40%/16px 16px 18px 18px;background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,0));pointer-events:none}
.ttl{font:900 21px/1 Nunito,sans-serif}
.lab{font:800 11.5px/1 Nunito,sans-serif;letter-spacing:.06em;color:var(--dim)}
.kk{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;padding:0 4px;font:800 10.5px/1 Nunito;color:var(--dim);border:1px solid var(--hair2);border-radius:8px;background:rgba(255,255,255,.7)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.b{display:flex;align-items:center;justify-content:center;gap:7px;height:40px;min-width:40px;padding:0 11px;border-radius:999px;color:var(--tx);font:800 13px/1 Nunito;background:linear-gradient(180deg,#fff,#dcecfb);border:1.5px solid #fff;box-shadow:0 2px 6px rgba(20,70,130,.25),inset 0 -2px 0 rgba(80,140,210,.25);position:relative;white-space:nowrap}
.b.on{background:linear-gradient(180deg,#6ab8ff,#1f74cf);border-color:#bfe0ff;color:#fff;text-shadow:0 1px 1px rgba(0,40,90,.5)}
.b.dim{opacity:.45}
.b.go{background:linear-gradient(180deg,#8fe07a,#36a52c);border-color:#d8ffd0;color:#fff;text-shadow:0 1px 1px rgba(0,60,0,.4)}
.seg{display:flex;gap:2px;padding:2px;border-radius:999px;background:rgba(255,255,255,.6);border:1.5px solid #fff}
.seg .b{height:28px;border:0;box-shadow:none;background:transparent;font-size:12px;padding:0 10px}
.seg .b.on{background:linear-gradient(180deg,#6ab8ff,#1f74cf);color:#fff}
.sep{width:1px;align-self:stretch;margin:6px 4px;background:var(--hair2)}
#where{left:16px;top:16px;height:60px;display:flex;align-items:center;gap:14px;padding:0 18px}
#where .m{width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
#where .s{font:700 13px/1 Nunito;color:var(--dim)}
#where .who{display:flex;align-items:center}
#where .who i{width:26px;height:26px;border-radius:50%;border:2px solid #fff;margin-left:-7px;box-shadow:0 1px 3px rgba(0,0,0,.25);font:900 11px/22px Nunito;color:#fff;text-align:center;font-style:normal}
#mocktag{position:absolute;left:16px;top:86px;font:700 11px/1 Nunito,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#fff;background:rgba(0,0,0,.55);padding:6px 9px;border-radius:4px}
#view{right:16px;top:16px;height:60px;display:flex;align-items:center;gap:6px;padding:0 10px}
#view .nm{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:96px}
#view .nm b{font:900 15px/1 Nunito}
#modes{left:16px;bottom:16px;width:104px;height:268px;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 0}
.mode{width:72px;display:flex;flex-direction:column;align-items:center;gap:5px;font:800 13px/1 Nunito;color:var(--dim)}

.mode.on{color:var(--tx)}
.mode.on i{background:linear-gradient(180deg,#6ab8ff,#1f74cf);color:#fff;border-color:#cfe7ff}
#strip{left:132px;right:16px;bottom:16px;height:268px;display:grid;grid-template-columns:236px 1fr 326px}
#cats{border-right:1px solid var(--hair);padding:12px 12px 0;display:flex;flex-direction:column;gap:8px}
#cats .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.cat{height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid transparent;position:relative;background:var(--tile);box-shadow:0 1px 3px rgba(20,70,130,.15)}
.cat svg.i{width:23px;height:23px;color:var(--tx)}
.cat.on{background:var(--tileOn);border:2px solid #fff;box-shadow:0 0 0 2px var(--acc)}
.cat .nw{position:absolute;top:-5px;right:-5px;width:12px;height:12px;border-radius:50%;background:var(--amber);border:2px solid #fff}
#cats .nm{font:900 15px/1 Nunito;margin-top:1px;display:flex;justify-content:space-between;align-items:baseline}
#cats .nm em{font:700 11px/1 Nunito;color:var(--dim);font-style:normal}
#main{display:flex;flex-direction:column;padding:10px 14px 12px;gap:9px;min-width:0}
#subs{display:flex;gap:5px;align-items:center;flex-wrap:nowrap}

#items{display:grid;grid-template-columns:repeat(8,1fr);grid-template-rows:repeat(2,1fr);gap:8px;flex:1;position:relative}
.t{position:relative;border-radius:14px;background:var(--tile);border:1.5px solid #fff;box-shadow:0 2px 6px rgba(20,70,130,.18);display:flex;align-items:center;justify-content:center;overflow:hidden}

.t .n{position:absolute;left:5px;right:5px;bottom:5px;font:800 10.5px/1.1 Nunito;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--dim)}
.t.on{background:var(--tileOn);border:2px solid #fff;box-shadow:0 0 0 2.5px var(--acc),0 3px 10px rgba(20,70,130,.3)}
.t.on .n{color:var(--tx)}
.t .nw{position:absolute;top:5px;left:5px;font:900 9px/1 Nunito;letter-spacing:.04em;padding:3px 5px;border-radius:6px;background:var(--amber);color:#fff;z-index:2}
#pg{display:flex;align-items:center;gap:6px;margin-left:auto;white-space:nowrap;font:700 11.5px/1 Nunito;color:var(--dim)}
#pg .b{height:26px;min-width:26px;padding:0 6px}
#tools{position:absolute;left:16px;bottom:298px;display:flex;gap:6px;padding:7px 8px;height:56px;align-items:center}
#tools .b{height:40px;width:40px;padding:0}
#tools .hint{font:700 12.5px/1 Nunito;color:var(--dim);padding:0 8px 0 4px;display:flex;gap:6px;align-items:center}
#tools .hint b{color:var(--tx)}
#card{border-left:1px solid var(--hair);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
#card .top{display:flex;gap:12px}
#card .pic{width:92px;height:92px;flex:none;border-radius:14px;background:var(--tile) center/cover;border:1.5px solid #fff;box-shadow:0 2px 6px rgba(20,70,130,.2);display:flex;align-items:center;justify-content:center}
#card .pic svg.art{width:70%;height:70%;fill:#cfe3f5;stroke:var(--tx);stroke-width:1.3;stroke-linejoin:round}
#card h3{font:900 19px/1.05 Nunito}
#card p{font:700 11.5px/1.35 Nunito;color:var(--dim);margin-top:5px}
#card .chips{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.chip{font:800 10.5px/1 Nunito;padding:4px 7px;border-radius:999px;border:1px solid #fff;background:rgba(255,255,255,.7);color:var(--tx)}
.row{display:flex;align-items:center;gap:6px}
.row .lab{width:62px;flex:none}
.dot{width:22px;height:22px;border-radius:50%;border:2px solid rgba(255,255,255,.85);box-shadow:0 1px 3px rgba(0,0,0,.35);flex:none}
.dot.on{outline:2px solid var(--acc);outline-offset:1px}
.hue{height:14px;flex:1;border-radius:999px;background:linear-gradient(90deg,#e05050,#e0b050,#a0d050,#50c0a0,#5090e0,#9060d0,#e05090);border:1.5px solid #fff;position:relative;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.hue::after{content:"";position:absolute;left:var(--at,30%);top:-4px;width:18px;height:18px;border-radius:50%;background:#fff;border:2px solid var(--tx);transform:translateX(-50%)}
.slide{height:8px;flex:1;border-radius:999px;background:linear-gradient(90deg,var(--acc) var(--at,40%),rgba(42,132,220,.18) var(--at,40%));position:relative}
.slide::after{content:"";position:absolute;left:var(--at,40%);top:-6px;width:20px;height:20px;border-radius:50%;background:linear-gradient(180deg,#fff,#dcecfb);border:1.5px solid #fff;box-shadow:0 1px 4px rgba(20,70,130,.45);transform:translateX(-50%)}
.val{font:900 13px/1 Nunito;min-width:42px;text-align:right}
#card .foot{margin-top:auto;display:flex;gap:6px;align-items:center}
.slot{border:1px dashed var(--hair2);color:var(--dim);font:700 11px/1 Nunito;padding:5px 8px;border-radius:8px;margin-left:auto}
#ov{position:absolute;inset:0;pointer-events:none}
.tag{position:absolute;padding:8px 11px;display:flex;flex-direction:column;gap:4px;font:900 12.5px/1.15 Nunito;transform:translate(var(--dx,14px),var(--dy,-50%))}
.tag small{font:700 11px/1.25 Nunito;color:var(--dim)}
.tag .row{gap:5px;font:700 11px/1 Nunito;color:var(--dim)}
.tag.amber{box-shadow:0 0 0 2px var(--amber),0 10px 30px rgba(10,50,100,.35)}
.tag.green b{color:var(--good)}
#keys{right:16px;bottom:298px;height:36px;display:flex;align-items:center;gap:12px;padding:0 14px;font:700 12px/1 Nunito;color:var(--dim)}
#keys b{color:var(--tx);font-weight:900}
#legend{position:absolute;right:16px;top:86px;width:300px;padding:12px 14px;font:700 12px/1.4 Nunito;color:var(--tx);display:flex;flex-direction:column;gap:6px}
#legend b{font-weight:900}
#legend .lab{margin-bottom:2px}
.pick{position:absolute;padding:14px 16px;display:flex;flex-direction:column;gap:10px;width:330px}
</style>
</head>

<div id="ov"></div>
<script type="module">
const S = new URLSearchParams(location.search).get("s") ?? "walls";
document.body.style.backgroundImage = `url(bg/${S}.jpg)`;
const A = (await (await fetch("anchors.json")).json())[S] ?? {};
const P = {

  up: "M6 15l6-6 6 6", down: "M6 9l6 6 6-6", left: "M15 6l-6 6 6 6", right: "M9 6l6 6-6 6",

  top: "M12 3v4M12 17v4M3 12h4M17 12h4M8 8h8v8H8z", grid: "M4 4h16v16H4zM4 9.3h16M4 14.6h16M9.3 4v16M14.6 4v16",

  build: "M3 21h18M5 21V10l7-6 7 6v11M9 21v-6h6v6", lot: "M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2zM9 4v14M15 6v14",
  wall: "M3 20h18M4 20V6h16v14M4 10.6h16M4 15.3h16M9 6v4.6M15 6v4.6M12 10.6v4.7M7 15.3V20M17 15.3V20",
  floor: "M3 15l9-5 9 5-9 5zM7.5 12.5l9 5M12 10l4.5 7.5M16.5 12.5l-9 5", paint: "M5 4h12v5H5zM17 6.5h2v5h-8v3M10 14.5h2V21h-2z",
  roof: "M2 13l10-8 10 8M5 11v9h14v-9", rooms: "M4 4h16v16H4zM12 4v9M4 13h9M16 13h4",
  found: "M3 15h18v5H3zM6 15v-4h12v4M7 17.5h2M11 17.5h2M15 17.5h2", base: "M2 9h20M5 9v11h14V9M9 20v-5h6v5M5 13h14",

  trim: "M3 5h18M3 8h18M4 8c0 2 2 3 4 3s4-1 4-3c0 2 2 3 4 3s4-1 4-3M3 14h18M3 19h18", stairs: "M3 20h4v-4h4v-4h4V8h4V4h2",
  pool: "M3 7h18v12H3zM3 12c2-1.5 4-1.5 6 0s4 1.5 6 0 4-1.5 6 0M15 4v8M18 4v8", terrain: "M2 18l6-8 4 5 3-3 7 6zM2 21h20",

  plus: "M12 5v14M5 12h14", move: "M12 3v18M3 12h18M12 3l-3 3M12 3l3 3M12 21l-3-3M12 21l3-3M3 12l3-3M3 12l3 3M21 12l-3-3M21 12l-3 3",

  line: "M4 18L20 6M4 18h.01M20 6h.01", arc: "M4 18c2-8 8-12 16-12", box: "M5 5h14v14H5z", push: "M3 12h18M7 8l-4 4 4 4M17 8l4 4-4 4M12 4v16",
  sel: "M5 3l14 8-6 2-2 6z", erase: "M8 20l-4-4L14 6l6 6-8 8zM4 20h16M9 11l6 6", fill: "M5 11l7-7 7 7-7 7zM19 15s2 2.4 2 3.5a2 2 0 0 1-4 0c0-1.1 2-3.5 2-3.5z",

const ic = (n, s = 22) => `<svg class="i" viewBox="0 0 24 24" style="width:${s}px;height:${s}px"><path d="${P[n]}"/></svg>`;
const art = (d) => `<svg class="art" viewBox="0 0 48 40">${d}</svg>`;
const $ = (h) => { const d = document.createElement("div"); d.innerHTML = h.trim(); return document.body.appendChild(d.firstElementChild); };
const tex = (n) => `tex/${n}.jpg`;
const at = (k, dx = 14, dy = "-50%") => { const p = A[k] ?? [700, 400]; return `left:${p[0]}px;top:${p[1]}px;--dx:${typeof dx === "number" ? dx + "px" : dx};--dy:${typeof dy === "number" ? dy + "px" : dy}`; };
const tag = (k, html, o = {}) => $(`<div class="pn tag ${o.cls ?? ""}" style="${at(k, o.dx, o.dy)}">${html}</div>`);

// ── what each shot is
const PARTS = [["found", "Foundation"], ["base", "Basement"], ["wall", "Walls"], ["fence", "Fences & rails"], ["column", "Columns"], ["trim", "Trims"], ["floor", "Floors"], ["paint", "Coverings"],
  ["door", "Doors"], ["window", "Windows"], ["stairs", "Stairs"], ["roof", "Roof"], ["pool", "Pool"], ["rooms", "Rooms"], ["terrain", "Terrain"]];
const NEWP = new Set(["found", "base", "fence", "column", "trim", "pool", "terrain"]);
const SHOT = {
  foundation: { part: "found", floor: "Ground", hint: "<b>Foundation</b> · drag a box, <span class=kk>↕</span> its height" },
  basement: { part: "base", floor: "Basement 2", hint: "<b>Basement</b> · drag under the house to dig" },
  walls: { part: "wall", floor: "Ground", hint: "<b>Walls</b> · click a room to move it whole, drag a wall to push it" },
  floors: { part: "floor", floor: "Ground", hint: "<b>Floors</b> · paint tile by tile; <span class=kk>⇧</span> the room" },
  stairs: { part: "stairs", floor: "Ground", hint: "<b>Stairs</b> · drag from the foot up; the hole's cut for you" },
  roof: { part: "roof", floor: "Roof", hint: "<b>Roof</b> · drag the handles; click a slope for a dormer" },
  openings: { part: "window", floor: "Ground", hint: "<b>Windows</b> · slide along, <span class=kk>↑</span><span class=kk>↓</span> up and down" },
  coverings: { part: "paint", floor: "Upstairs", hint: "<b>Coverings</b> · click a face; <span class=kk>⇧</span> the room, <span class=kk>⌃⇧</span> the house" },
  pool: { part: "pool", floor: "Ground", hint: "<b>Pool</b> · drag a box in the ground, <span class=kk>↓</span> deeper" },
  blueprint: { part: null, floor: "Ground", hint: "<b>Blueprints</b> · pick one, it follows the pointer" },
};
const sh = SHOT[S];
const LABEL = { lot: "Lot · a free lot", foundation: "Foundation", basement: "Basement (two deep)", walls: "Walls · rooms moved whole, fences", floors: "Floors · the tile brush", stairs: "Stairs · one modular tool", roof: "Roof · Auto Roof and handles", openings: "Windows · sized, joined, moved up", coverings: "Coverings · material and colour", pool: "Pool", blueprint: "Blueprints · your own" };
$(`<div id="mocktag">Plan 130 mock · ${LABEL[S]}</div>`);

if (S === "lot") {
  // live mode by the sign: the claim card, no build screen
  $(`<div class="pn" id="where"><span class="m"></span><span class="ttl">Pine Meadow</span><span class="s">by the north path · 3 lots, 2 free</span></div>`);
  $(`<div class="pn pick" style="left:${A.sign[0] + 70}px;top:${A.sign[1] - 230}px">
     <div class="row" style="gap:12px"><div style="width:54px;height:54px;border-radius:16px;background:linear-gradient(180deg,#6ab8ff,#1f74cf);display:flex;align-items:center;justify-content:center;color:#fff;border:2px solid #fff;box-shadow:0 3px 8px rgba(20,70,130,.3)">${ic("lot", 30)}</div>
       <div><div class="ttl">Lot 7 · free</div><div class="lab" style="margin-top:5px;width:auto">Pine Meadow · 24 × 28 m · flat</div></div></div>
