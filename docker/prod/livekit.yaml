# LiveKit for production. Fill in the TURN domain; keys come from livekit.keys.yaml (chmod 600).
port: 7880
rtc:
  tcp_port: 7881
  port_range_start: 50000
  port_range_end: 60000
  use_external_ip: true
turn:
  # built-in TURN so people behind corporate firewalls still connect
  enabled: true
  domain: turn.example.com # ← your TURN domain (DNS → this server)
  tls_port: 5349
  udp_port: 3478
  external_tls: false
  cert_file: /etc/turn/fullchain.pem
  key_file: /etc/turn/privkey.pem
key_file: /etc/livekit.keys.yaml
room:
  empty_timeout: 300
  departure_timeout: 20
logging:
  level: info
